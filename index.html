<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Primordial Canopy - Photorealistic Film VFX Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020604;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            touch-action: none;
        }
        .cinematic-font {
            font-family: 'Cinzel', serif;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .vignette-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle at center, transparent 58%, rgba(1, 5, 3, 0.55) 85%, rgba(0, 0, 0, 0.88) 100%);
            transition: box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .danger-pulse {
            box-shadow: inset 0 0 180px rgba(185, 28, 28, 0.95) !important;
        }
        .totem-selector {
            background: radial-gradient(circle at 50% 25%, rgba(14, 42, 30, 0.92), rgba(2, 8, 5, 0.98));
            border: 1.5px solid rgba(52, 211, 153, 0.28);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(16, 185, 129, 0.12);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .totem-selector.active {
            border-color: #34d399;
            transform: scale(1.06) translateY(-4px);
            box-shadow: 0 0 45px rgba(52, 211, 153, 0.45), inset 0 0 35px rgba(52, 211, 153, 0.25);
        }
        .touch-ripple {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 1.5px solid rgba(167, 243, 208, 0.35);
            background: radial-gradient(circle, rgba(52, 211, 153, 0.12) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 15;
            transition: opacity 0.25s ease;
        }
        #run-toggle-btn {
            position: absolute;
            bottom: 1.75rem;
            right: 1.75rem;
            z-index: 20;
            background: rgba(3, 28, 20, 0.78);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(52, 211, 153, 0.45);
            color: #6ee7b7;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0,0,0,0.85);
            transition: all 0.25s ease;
        }
        #run-toggle-btn.active {
            background: rgba(16, 185, 129, 0.32);
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 28px rgba(52, 211, 153, 0.65);
        }
        .control-grid {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:0.55rem 1.5rem;
            width:min(34rem,92vw);
            padding:1rem 1.25rem;
            margin-bottom:1.5rem;
            border:1px solid rgba(167,243,208,.18);
            background:rgba(2,12,8,.58);
            box-shadow:inset 0 0 30px rgba(16,185,129,.06), 0 18px 40px rgba(0,0,0,.55);
        }
        .control-grid span { color:rgba(209,250,229,.76); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; }
        .asset-loader {
            position:absolute; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:rgba(1,5,3,.82); backdrop-filter:blur(14px); pointer-events:auto; transition:opacity .6s ease;
        }
        .asset-loader.hidden { opacity:0; pointer-events:none; }
        .asset-progress { width:min(22rem,70vw); height:4px; margin-top:1rem; background:rgba(167,243,208,.15); overflow:hidden; }
        .asset-progress > i { display:block; width:8%; height:100%; background:#6ee7b7; box-shadow:0 0 18px rgba(110,231,183,.8); transition:width .35s ease; }
        #animal-glimpse { position:absolute; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; pointer-events:none; background:radial-gradient(circle, transparent 18%, rgba(0,0,0,.34) 72%, rgba(0,0,0,.72)); opacity:1; transition:opacity .25s ease; }
        #animal-glimpse.hidden { display:none; }
        #animal-glimpse.fading { opacity:0; }
        #glimpse-silhouette { width:min(46vw,16rem); height:min(30vw,10rem); opacity:.62; filter:blur(.35px) drop-shadow(0 0 22px rgba(178,205,192,.3)); background:radial-gradient(ellipse at 52% 52%, rgba(13,18,18,.98) 0 42%, transparent 44%), radial-gradient(ellipse at 27% 61%, rgba(8,13,13,.98) 0 19%, transparent 21%), radial-gradient(ellipse at 74% 38%, rgba(8,13,13,.98) 0 10%, transparent 12%); clip-path:polygon(5% 74%, 20% 59%, 34% 57%, 43% 45%, 55% 50%, 68% 46%, 82% 52%, 96% 42%, 91% 64%, 77% 64%, 67% 79%, 47% 78%, 31% 82%, 15% 84%); }
        #glimpse-silhouette.squirrel { transform:scale(.58); clip-path:polygon(3% 78%, 20% 62%, 37% 62%, 47% 52%, 61% 57%, 76% 42%, 84% 17%, 93% 6%, 91% 35%, 82% 56%, 96% 66%, 80% 79%, 57% 76%, 39% 84%, 17% 86%); }
        #glimpse-label { position:absolute; bottom:22%; color:rgba(220,235,229,.86); font:700 .64rem/1.2 Inter,sans-serif; letter-spacing:.28em; text-transform:uppercase; text-shadow:0 2px 16px #000; }
        #start-modal { background:radial-gradient(circle at 50% 32%, rgba(16,35,39,.94), rgba(1,4,8,.98) 72%) !important; }
        #start-modal h1 { color:#d5e3e6 !important; text-shadow:0 0 26px rgba(126,190,204,.2), 0 5px 26px rgba(0,0,0,.9); }
        #begin-btn { background:linear-gradient(180deg, rgba(24,48,54,.92), rgba(4,14,18,.98)) !important; border-color:rgba(154,199,210,.62) !important; box-shadow:inset 0 0 20px rgba(125,181,194,.08), 0 14px 34px rgba(0,0,0,.82) !important; }
        #begin-btn:hover { background:linear-gradient(180deg, rgba(37,70,75,.96), rgba(6,19,23,.98)) !important; }
        #begin-btn span:first-child { background:#a4d2d9 !important; box-shadow:0 0 12px rgba(164,210,217,.7); }
        #direction-pad { position:absolute; left:1.25rem; bottom:1.35rem; z-index:20; display:grid; grid-template-columns:repeat(3,3.3rem); grid-template-rows:repeat(2,3.3rem); gap:.32rem; opacity:.9; }
        #direction-pad.hidden { display:none; }
        #direction-pad button { border:1px solid rgba(166,205,214,.48); color:#c8e0e4; background:rgba(5,17,22,.84); box-shadow:inset 0 0 16px rgba(116,174,186,.08), 0 8px 18px rgba(0,0,0,.65); font-family:Inter,sans-serif; font-size:1.12rem; font-weight:800; border-radius:.48rem; touch-action:none; }
        #direction-pad button:active { background:rgba(64,103,111,.78); transform:translateY(1px); }
        #direction-pad .up { grid-column:2; grid-row:1; }
        #direction-pad .left { grid-column:1; grid-row:2; }
        #direction-pad .down { grid-column:2; grid-row:2; }
        #direction-pad .right { grid-column:3; grid-row:2; }
        #right-touch-ring { border-color:rgba(210,239,246,.62); background:radial-gradient(circle, rgba(142,204,217,.18), transparent 70%); box-shadow:0 0 24px rgba(142,204,217,.24); }
    </style>
</head>
<body>

<div id="canvas-container"></div>
<div id="vignette" class="vignette-overlay"></div>

<!-- Invisible Touch Feedback Rings for Mobile -->
<div id="left-touch-ring" class="touch-ripple opacity-0"></div>
<div id="right-touch-ring" class="touch-ripple opacity-0"></div>

<!-- Minimal Run Toggle Control -->
<button id="run-toggle-btn" class="hidden">RUN: OFF</button>

<div id="direction-pad" class="hidden" aria-label="Movement controls">
    <button class="up" data-key="w" aria-label="Move forward">▲</button>
    <button class="left" data-key="a" aria-label="Move left">◀</button>
    <button class="down" data-key="s" aria-label="Move backward">▼</button>
    <button class="right" data-key="d" aria-label="Move right">▶</button>
</div>

<!-- Game start modal -->
<div id="start-modal" class="absolute inset-0 z-40 flex flex-col items-center justify-center p-6 bg-black/80 backdrop-blur-xl transition-opacity duration-700">
    <h1 class="cinematic-font text-3xl md:text-5xl font-extrabold text-emerald-100 tracking-[0.3em] mb-12 drop-shadow-2xl text-center">
        PRIMORDIAL CANOPY
    </h1>

    <div class="control-grid">
        <span>W A S D / arrows · move</span><span>mouse / right touch · look</span>
        <span>Shift / RUN · sprint</span><span>touch object · reach / rustle</span>
    </div>

    <button id="begin-btn" disabled class="group relative px-14 py-4 rounded-full bg-emerald-500/20 disabled:opacity-60 disabled:cursor-wait hover:bg-emerald-500/35 border border-emerald-400/60 transition-all duration-300 flex items-center gap-3 shadow-2xl cursor-pointer">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 group-hover:scale-125 transition"></span>
        <span class="cinematic-font text-sm tracking-[0.3em] text-white font-bold uppercase">START GAME</span>
    </button>
</div>

<div id="asset-loader" class="asset-loader">
    <div class="cinematic-font text-emerald-100 text-sm tracking-[0.28em] uppercase">Loading forest assets</div>
    <div class="text-emerald-200/60 text-[0.65rem] tracking-[0.18em] uppercase mt-2">PBR vegetation · night sky · rain surface</div>
    <div class="asset-progress"><i id="asset-progress-bar"></i></div>
</div>

<!-- Tragic Fate Modal (Never shown on Winning Sanctuary Path) -->
<div id="ending-modal" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-black/92 backdrop-blur-2xl transition-opacity duration-1000">
    <h2 id="ending-title" class="cinematic-font text-2xl md:text-4xl font-extrabold text-white tracking-[0.2em] text-center mb-3"></h2>
    <p id="ending-desc" class="text-emerald-200/75 text-xs md:text-sm tracking-widest uppercase text-center max-w-md mb-10"></p>
    <div class="flex gap-5">
        <button id="retry-fork-btn" class="px-7 py-3.5 rounded-full bg-emerald-950/85 hover:bg-emerald-800/85 border border-emerald-400/45 text-emerald-100 cinematic-font text-xs tracking-[0.2em] uppercase transition cursor-pointer">
            STEP BACK
        </button>
        <button id="restart-full-btn" class="px-7 py-3.5 rounded-full bg-emerald-500/25 hover:bg-emerald-500/45 border border-emerald-300/65 text-white cinematic-font text-xs tracking-[0.2em] uppercase transition cursor-pointer">
            RESTART
        </button>
    </div>
</div>

<div id="animal-glimpse" class="hidden">
    <div id="glimpse-silhouette"></div>
    <div id="glimpse-label">MOVEMENT IN THE RAIN</div>
</div>

<script>
const GAME_STATE = {
    started: false,
    gender: 'male',
    phase: 'WALKING', // WALKING | SANCTUARY_FREEROAM | ENDING_SEQUENCE | ENDED
    sprint: false,
    moveVelocity: 0,
    fatigue: 0.0,
    fear: 0.0,
    isTrapped: false,
    inWater: false,
    waterDepth: 0,
    touchTarget: null,
    touchPulse: 0,
    assetsReady: false,
    cameraYaw: 0,
    cameraPitch: 0,
    bobTimer: 0,
    stepAccum: 0,
    breathTimer: 1.5,
    ambientTimer: 2.5,
    surpriseTriggered: false,
    endingTimer: 0,
    currentOutcome: null,
    rainIntensity: 0.85,
    checkpointPos: { x: 0, z: -25 }
};

// 6 Terminal Zones along the deep jungle horizon (Z = -195 to -235)
// Note: X around [-18 to +28] is the open Winning Sanctuary Valley; outer/specific zones house unmarked natural hazards
const HAZARD_ZONES = [
    { id: 0, x: -75, z: -155, radius: 14, outcomeType: "TRIBE_CAPTURE", title: "THE LEFT PATH CLOSES", desc: "Dense roots and unseen movement turn the western path into a dead end" },
    { id: 1, x: -38, z: -175, radius: 14, outcomeType: "PREDATOR_AMBUSH", title: "WOLF HOWL IN THE UNDERGROWTH", desc: "A close howl breaks through the rain and dense forest" },
    { id: 2, x: -12, z: -135, radius: 11, outcomeType: "SPIKE_TRAP", title: "DEADFALL SINKHOLE", desc: "The rain-rotted root bridge collapses into a deep limestone chasm" },
    { id: 3, x: 42,  z: -165, radius: 14, outcomeType: "PATH_SNARE", title: "THORN PASS", desc: "The eastern track narrows until the forest seals behind you" },
    { id: 4, x: 76,  z: -150, radius: 14, outcomeType: "QUICKSAND_MIRE", title: "BOTTOMLESS PEAT MIRE", desc: "A wrong turn sinks into rain-soaked peat" },
    { id: 5, x: -58, z: -102, radius: 12, outcomeType: "ROOT_CAVERN", title: "ROOT CAVERN", desc: "The northern fork drops beneath a collapsing root shelf" },
    { id: 6, x: 58, z: -112, radius: 12, outcomeType: "BRAMBLE_LOCK", title: "BRAMBLE LOCK", desc: "A bright opening was only a loop through the thorn wall" }
];

class JungleAudioEngine {
    constructor() {
        this.initialized = false;
        this.rainGain = null;
    }

    async init() {
        if (this.initialized) return;
        try {
            await Tone.start();

            this.wolfRecording = new Audio('assets/audio/wolf-howls.ogg');
            this.wolfRecording.preload = 'auto';
            this.squirrelRecording = new Audio('assets/audio/jungle-palm-squirrel-sound.wav');
            this.squirrelRecording.preload = 'auto';

            // Natural rainforest canopy rain + breeze
            this.rainNoise = new Tone.Noise("pink").start();
            this.rainFilter = new Tone.Filter({ type: "bandpass", frequency: 1050, Q: 0.7 });
            this.rainGain = new Tone.Gain(0.055).toDestination();
            this.rainNoise.connect(this.rainFilter);
            this.rainFilter.connect(this.rainGain);

            // Organic mud & leaf crunch footstep
            this.stepSynth = new Tone.NoiseSynth({
                noise: { type: "brown" },
                envelope: { attack: 0.004, decay: 0.11, sustain: 0 }
            }).toDestination();
            this.stepSynth.volume.value = -25;

            // Puddle water splash
            this.splashSynth = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.006, decay: 0.09, sustain: 0 }
            });
            this.splashFilter = new Tone.Filter(1800, "bandpass").toDestination();
            this.splashSynth.connect(this.splashFilter);
            this.splashSynth.volume.value = -28;

            // Low, restrained death impact; avoid bright arcade-like tones.
            this.deathRumble = new Tone.MembraneSynth({
                pitchDecay: 0.08,
                octaves: 2.2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.008, decay: 1.15, sustain: 0.02, release: 1.3 }
            }).toDestination();
            this.deathRumble.volume.value = -13;
            this.deathNoise = new Tone.NoiseSynth({
                noise: { type: "brown" },
                envelope: { attack: 0.04, decay: 1.2, sustain: 0, release: 0.5 }
            }).toDestination();
            this.deathNoise.volume.value = -24;

            // Explorer dynamic breathing (gender-tuned formant filter)
            this.breathSynth = new Tone.NoiseSynth({
                noise: { type: "pink" },
                envelope: { attack: 0.34, decay: 0.68, sustain: 0.04, release: 0.48 }
            });
            this.breathFilter = new Tone.Filter({ type: "lowpass", frequency: 430, Q: 0.55 });
            this.breathGain = new Tone.Gain(0.22).toDestination();
            this.breathSynth.connect(this.breathFilter);
            this.breathFilter.connect(this.breathGain);

            // Dedicated animal cues: distant wolf howl and close squirrel chatter.
            this.wolfSynth = new Tone.FMSynth({
                harmonicity: 0.5,
                modulationIndex: 3.2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.18, decay: 1.4, sustain: 0.15, release: 1.8 }
            });
            this.wolfFilter = new Tone.Filter(720, "lowpass").toDestination();
            this.wolfDelay = new Tone.FeedbackDelay("8n", 0.22).toDestination();
            this.wolfSynth.connect(this.wolfFilter);
            this.wolfFilter.connect(this.wolfDelay);
            this.wolfSynth.volume.value = -19;

            this.squirrelSynth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.008, decay: 0.08, sustain: 0.04, release: 0.08 }
            });
            this.squirrelFilter = new Tone.Filter(2400, "bandpass").toDestination();
            this.squirrelSynth.connect(this.squirrelFilter);
            this.squirrelSynth.volume.value = -26;

            // Prehistoric animal vocalization & nocturnal bird/frog synth
            this.creatureSynth = new Tone.FMSynth({
                harmonicity: 1.35,
                modulationIndex: 8,
                envelope: { attack: 0.04, decay: 0.75, sustain: 0.25, release: 0.8 }
            }).toDestination();

            // Vocal gasp / scream synth
            this.vocalSynth = new Tone.MonoSynth({
                oscillator: { type: "sawtooth" },
                filter: { Q: 3, type: "bandpass", rolloff: -24 },
                envelope: { attack: 0.03, decay: 0.5, sustain: 0.2, release: 0.5 },
                filterEnvelope: { attack: 0.02, decay: 0.4, sustain: 0.2, baseFrequency: 500, octaves: 2.5 }
            }).toDestination();

            this.initialized = true;
        } catch (err) {
            console.warn("Audio initialization skipped:", err);
        }
    }

    setRainVolume(level) {
        if (!this.initialized || !this.rainGain) return;
        this.rainGain.gain.rampTo(0.055 * level, 1.5);
    }

    playFootstep(isSprint = false) {
        if (!this.initialized) return;
        try {
            this.stepSynth.volume.value = isSprint ? -20 : -25;
            this.stepSynth.triggerAttackRelease(isSprint ? 0.12 : 0.09);
            this.splashSynth.volume.value = isSprint ? -27 : -31;
            this.splashSynth.triggerAttackRelease(isSprint ? 0.08 : 0.055, "+0.03");
        } catch (e) {}
    }

    playWaterStep(isSprint = false, depth = 0.5) {
        if (!this.initialized) return;
        try {
            this.stepSynth.volume.value = isSprint ? -25 : -29;
            this.stepSynth.triggerAttackRelease(isSprint ? 0.14 : 0.11);
            this.splashFilter.frequency.rampTo(900 + depth * 900, 0.08);
            this.splashSynth.volume.value = isSprint ? -20 : -24;
            this.splashSynth.triggerAttackRelease(isSprint ? 0.22 : 0.17);
        } catch (e) {}
    }

    playBreathing(gender = 'male', fatigue = 0.0) {
        if (!this.initialized) return;
        try {
            const baseFreq = gender === 'female' ? 410 : 350;
            this.breathFilter.frequency.rampTo(baseFreq + fatigue * 120, 0.25);
            this.breathSynth.volume.value = -7 + fatigue * 5;
            this.breathSynth.triggerAttackRelease(0.72);
            setTimeout(() => {
                if (this.initialized) this.breathSynth.triggerAttackRelease(fatigue > 0.35 ? 0.42 : 0.62);
            }, fatigue > 0.35 ? 410 : 820);
        } catch (e) {}
    }

    playNightJungleCall(distance = 'far') {
        // Disabled: synthetic tonal calls read as game beeps. Wildlife recordings handle animal cues.
        return;
    }

    playWolfCall(distance = 80, fear = 0.0) {
        if (!this.initialized || !this.wolfSynth) return;
        try {
            const near = Math.max(0, Math.min(1, 1 - distance / 120));
            if (this.wolfRecording) {
                this.wolfRecording.pause();
                this.wolfRecording.currentTime = 0;
                this.wolfRecording.volume = Math.min(1, 0.018 + near * 0.11 + fear * 0.025);
                this.wolfRecording.play().catch(() => {});
            }
            if (!this.wolfRecording) {
                this.wolfSynth.volume.value = -29 + near * 8 + fear * 2;
                this.wolfFilter.frequency.rampTo(420 + near * 520, 0.25);
                this.wolfSynth.triggerAttackRelease(near > 0.65 ? "E2" : "C2", "1n");
                setTimeout(() => {
                    if (!this.initialized) return;
                    this.wolfSynth.triggerAttackRelease(near > 0.65 ? "A1" : "G1", "1n");
                }, 520);
            }
        } catch (e) {}
    }

    playSquirrelChatter(distance = 30, fear = 0.0) {
        if (!this.initialized || !this.squirrelSynth) return;
        try {
            const near = Math.max(0, Math.min(1, 1 - distance / 55));
            if (this.squirrelRecording) {
                this.squirrelRecording.pause();
                this.squirrelRecording.currentTime = 0;
                this.squirrelRecording.volume = Math.min(1, 0.012 + near * 0.07);
                this.squirrelRecording.play().catch(() => {});
            }
            if (!this.squirrelRecording) {
                this.squirrelSynth.volume.value = -37 + near * 7 + fear * 1.5;
                this.squirrelFilter.frequency.rampTo(1900 + near * 1800, 0.12);
                const notes = ["A5", "C6", "E6", "B5"];
                notes.forEach((note, i) => {
                    setTimeout(() => {
                        if (this.initialized) this.squirrelSynth.triggerAttackRelease(note, "32n");
                    }, i * 95);
                });
            }
        } catch (e) {}
    }

    playAttackAndScream(gender = 'male', outcomeType = 'PREDATOR_AMBUSH') {
        if (!this.initialized) return;
        try {
            if (outcomeType === 'PREDATOR_AMBUSH' || outcomeType === 'TERROR_PACK') {
                // Animal attack keeps animal texture front and centre; death impact follows quietly.
                this.playWolfCall(12, 1.0);
                setTimeout(() => this.playSeriousDeath(), 420);
            } else {
                this.playSeriousDeath();
            }
        } catch (e) {}
    }

    playSeriousDeath() {
        if (!this.initialized || !this.deathRumble) return;
        try {
            this.deathRumble.triggerAttackRelease("C1", "1n", undefined, 0.72);
            this.deathRumble.triggerAttackRelease("F0", "2n", "+0.3", 0.38);
            this.deathNoise.triggerAttackRelease("1.05");
        } catch (e) {}
    }
}

const audioEngine = new JungleAudioEngine();

const interactiveObjects = [];
const vegetationCollisionGrid = new Map();
const VEGETATION_COLLISION_CELL = 32;

function registerVegetationCollider(x, z, radius) {
    const cellX = Math.floor(x / VEGETATION_COLLISION_CELL);
    const cellZ = Math.floor(z / VEGETATION_COLLISION_CELL);
    const key = `${cellX}:${cellZ}`;
    if (!vegetationCollisionGrid.has(key)) vegetationCollisionGrid.set(key, []);
    vegetationCollisionGrid.get(key).push({ x, z, radius });
}

function createBotanicalAndSurfaceTextures() {
    // 1. Monsterra / Split Tropical Leaf Texture (Alpha Cutout)
    const monsteraCanvas = document.createElement('canvas');
    monsteraCanvas.width = 512;
    monsteraCanvas.height = 512;
    const mCtx = monsteraCanvas.getContext('2d');
    mCtx.clearRect(0, 0, 512, 512);

    const leafGrad = mCtx.createRadialGradient(256, 300, 20, 256, 256, 230);
    leafGrad.addColorStop(0.0, '#1e4620');
    leafGrad.addColorStop(0.6, '#143316');
    leafGrad.addColorStop(1.0, '#0a1f0c');
    mCtx.fillStyle = leafGrad;

    mCtx.beginPath();
    mCtx.moveTo(256, 490);
    mCtx.bezierCurveTo(60, 440, 30, 180, 256, 25);
    mCtx.bezierCurveTo(482, 180, 452, 440, 256, 490);
    mCtx.fill();

    // Cut out natural fenestrations (slits in Monstera leaf)
    mCtx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 6; i++) {
        const y = 110 + i * 56;
        const w = 130 - Math.abs(i - 2.5) * 22;
        [-1, 1].forEach(side => {
            mCtx.beginPath();
            mCtx.ellipse(256 + side * (55 + w * 0.4), y, w * 0.55, 11, side * 0.22, 0, Math.PI * 2);
            mCtx.fill();
        });
    }
    mCtx.globalCompositeOperation = 'source-over';

    // Central midrib & veins
    mCtx.strokeStyle = '#2d5a27';
    mCtx.lineWidth = 6;
    mCtx.beginPath();
    mCtx.moveTo(256, 495);
    mCtx.lineTo(256, 35);
    mCtx.stroke();

    const monsteraTex = new THREE.CanvasTexture(monsteraCanvas);

    // 2. Detailed Multi-Leaflet Fern Frond Texture (Alpha Cutout)
    const fernCanvas = document.createElement('canvas');
    fernCanvas.width = 512;
    fernCanvas.height = 1024;
    const fCtx = fernCanvas.getContext('2d');
    fCtx.clearRect(0, 0, 512, 1024);

    // Central stem
    fCtx.strokeStyle = '#1b3b1a';
    fCtx.lineWidth = 8;
    fCtx.beginPath();
    fCtx.moveTo(256, 1015);
    fCtx.quadraticCurveTo(260, 512, 256, 15);

    // 46 pairs of organic serrated pinnae (leaflets)

        const t = i / 46;

        const span = Math.sin(Math.pow(t, 0.65) * Math.PI) * 235;

        [-1, 1].forEach(side => {

            pGrad.addColorStop(0.0, '#0f2912');
            pGrad.addColorStop(0.55, '#1e4d22');
            pGrad.addColorStop(1.0, '#3a6b33');
            fCtx.fillStyle = pGrad;

            fCtx.beginPath();
            fCtx.moveTo(256, y);
            fCtx.quadraticCurveTo(256 + side * span * 0.5, y - 22, 256 + side * span, y - 10);
            fCtx.quadraticCurveTo(256 + side * span * 0.55, y + 8, 256, y + 10);
            fCtx.closePath();
            fCtx.fill();
        });
    }
    const fernTex = new THREE.CanvasTexture(fernCanvas);

    // 3. Mossy Rainforest Bark Texture + Bump Map
    const barkCanvas = document.createElement('canvas');

    barkCanvas.height = 1024;

function enhanceFoliageMaterial(material, scatterHex = 0x4ade80, scatterStrength = 0.35, windAmplitude = 0.08) {
    material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = { value: 0 };
        shader.uniforms.uScatterColor = { value: new THREE.Color(scatterHex) };
        shader.uniforms.uScatterStrength = { value: scatterStrength };
        shader.uniforms.uWindAmp = { value: windAmplitude };

        shader.vertexShader = `
            uniform float uTime;
            uniform float uWindAmp;
        ` + shader.vertexShader;

        shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `
            #include <begin_vertex>
            float heightFactor = max(0.0, position.y);
            float sway = sin(uTime * 1.8 + position.x * 1.5 + position.z * 1.5) * uWindAmp * heightFactor;
            transformed.x += sway;
            transformed.z += sway * 0.6;
            `
        );

        shader.fragmentShader = `
            uniform vec3 uScatterColor;
            uniform float uScatterStrength;
        ` + shader.fragmentShader;

        shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            #include <dithering_fragment>
            #if NUM_DIR_LIGHTS > 0
                float backLight = max(0.0, dot(-vNormal, directionalLights[0].direction));
                gl_FragColor.rgb += uScatterColor * pow(backLight, 1.5) * uScatterStrength;
            #endif
            `
        );

        windMaterials.push(shader);
    };
    return material;
}

function loadGLTFAsset(url) {
    return new Promise((resolve, reject) => {
        if (!gltfLoader) return reject(new Error('GLTFLoader unavailable'));
        gltfLoader.load(url, resolve, undefined, reject);
    });
}

function terrainHeightAt(x, z) {
    if (z < -180 && Math.abs(x - 4) < 12) return 0;
    return Math.sin(x * 0.08) * Math.cos(z * 0.08) * 0.35 + Math.sin(x * 0.25 + z * 0.2) * 0.12;
}

function forestDensityGap(x, z) {
    const skyGap = Math.hypot(x - 96, z + 292) < 34;
    const waterGap = z < -188 && z > -412 && x > -8 && x < 16;
    const pathGap = Math.abs(x - Math.sin(z * 0.018) * 7.5) < 5.2;
    return skyGap || waterGap || pathGap;
}

function safePathCenterX(z) {
    return Math.sin(z * 0.018) * 7.5;
}

function isSafeSanctuaryPath(position) {
    return Math.abs(position.x - safePathCenterX(position.z)) < 8.5;
}

function riverCenterX(z) {
    return 4 + Math.sin((z + 300) * 0.055) * 4.8 + Math.sin((z + 300) * 0.13) * 0.8;
}

function waterDepthAt(position) {
    if (position.z > -188 || position.z < -410) return 0;
    const distance = Math.abs(position.x - riverCenterX(position.z));
    return THREE.MathUtils.clamp(1 - distance / 10, 0, 1);
}

function createForestProps() {
    forestPropsGroup = new THREE.Group();

        map: textures.barkTex,

        map: textures.barkTex,
        bumpMap: textures.barkTex,
        bumpScale: 0.018,
        roughness: 0.98,
        color: 0x493b28
    });

    // Fallen trunks and broken branches force narrow natural passages.
    for (let i = 0; i < 78; i++) {
        const angle = i * 2.17;
        const x = Math.sin(angle) * (18 + (i % 17) * 9.2);
        const z = 2 - (i % 102) * 4.8 - Math.cos(angle * 0.7) * 14;
        const length = 1.8 + (i % 6) * 0.65;
        const log = new THREE.Mesh(new THREE.CylinderGeometry(0.13 + (i % 3) * 0.04, 0.2 + (i % 4) * 0.05, length, 9), barkMaterial);
        log.position.set(x, terrainHeightAt(x, z) + 0.2, z);
        log.rotation.set(0.05 * Math.sin(angle), angle, Math.PI * 0.5 + 0.12 * Math.sin(i));
        log.castShadow = true;
        log.receiveShadow = true;
        forestPropsGroup.add(log);
    }

    // Natural lianas/ropes hanging across the canopy.
    for (let i = 0; i < 64; i++) {
        const angle = i * 1.91;
        const x = Math.sin(angle) * (16 + (i % 13) * 10.5);
        const z = 4 - (i % 94) * 5.0;
        const top = 11 + (i % 5) * 2.4;
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(x, terrainHeightAt(x, z) + top, z),
            new THREE.Vector3(x + Math.sin(angle) * 1.5, terrainHeightAt(x, z) + top * 0.62, z + 1.5),
            new THREE.Vector3(x + Math.cos(angle) * 2.2, terrainHeightAt(x, z) + 1.1, z + 3.5)
        ]);
        const rope = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.035 + (i % 3) * 0.012, 6, false), ropeMaterial);
        rope.castShadow = true;
        forestPropsGroup.add(rope);
    }

    // Small rain-fed pools, never large enough to read as a flooded floor.
    for (let i = 0; i < 24; i++) {
        const angle = i * 2.53;
        const x = Math.sin(angle) * (10 + (i % 12) * 12.5);
        const z = 4 - (i % 82) * 6.1 - Math.cos(angle) * 13;
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x163841,
            roughness: 0.16,
            metalness: 0.0,
            clearcoat: 0.18,
            transparent: true,
            opacity: 0.5,
            depthWrite: false
        });
        const pond = new THREE.Mesh(new THREE.CircleGeometry(1, 28), material);
        pond.rotation.x = -Math.PI / 2;
        pond.position.set(x, terrainHeightAt(x, z) + 0.025, z);
        pond.scale.set(0.7 + (i % 5) * 0.22, 0.45 + (i % 4) * 0.18, 1);
        pond.rotation.z = angle;
        forestPropsGroup.add(pond);
        pondMeshes.push({ mesh: pond, phase: angle, baseOpacity: material.opacity });
    }

    // Fallen leaves react to the player's airflow and foot movement.
    const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x6a4b2e, roughness: 0.94, side: THREE.DoubleSide });
    const leafGeo = new THREE.PlaneGeometry(0.16, 0.08, 1, 1);
    for (let i = 0; i < (isMobileDevice ? 80 : 180); i++) {
        const angle = i * 2.41;
        const x = Math.sin(angle) * (7 + (i % 26) * 5.8);
        const z = 5 - (i % 108) * 4.55 - Math.cos(angle * 0.5) * 10;
        const leaf = new THREE.Mesh(leafGeo, leafMaterial);
        leaf.position.set(x, terrainHeightAt(x, z) + 0.045, z);
        leaf.rotation.set(-Math.PI / 2, angle, (i % 7) * 0.3);
        leaf.scale.set(0.65 + (i % 5) * 0.12, 0.65 + (i % 3) * 0.16, 1);
        forestPropsGroup.add(leaf);
        fallenLeafActors.push({ mesh: leaf, baseY: leaf.position.y, velocityX: 0, velocityZ: 0, phase: angle });
    }

    // Spider webs between vegetation, revealed as player approaches.
    const webMaterial = new THREE.LineBasicMaterial({ color: 0xb8c9c0, transparent: true, opacity: 0.34, depthWrite: false });
    for (let i = 0; i < 0; i++) {
        const angle = i * 2.07;
        const x = Math.sin(angle) * (9 + (i % 18) * 8.4);
        const z = 2 - (i % 92) * 5.4 - Math.cos(angle) * 9;
        const width = 0.8 + (i % 4) * 0.24;
        const height = 0.65 + (i % 5) * 0.18;
        const vertices = [];
        for (let r = 0; r < 7; r++) {
            const theta = (r / 7) * Math.PI * 2;
            vertices.push(0, height * 0.5, 0, Math.cos(theta) * width, Math.sin(theta) * height - height * 0.12, 0);
        }
        for (let ring = 1; ring < 3; ring++) {
            const radius = ring / 3;
            for (let r = 0; r < 7; r++) {
                const theta = (r / 7) * Math.PI * 2;
                const next = ((r + 1) % 7 / 7) * Math.PI * 2;
                vertices.push(Math.cos(theta) * width * radius, Math.sin(theta) * height * radius, 0, Math.cos(next) * width * radius, Math.sin(next) * height * radius, 0);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const web = new THREE.LineSegments(geometry, webMaterial.clone());
        web.position.set(x, terrainHeightAt(x, z) + 1.4 + (i % 4) * 0.3, z);
        web.rotation.y = angle;
        web.userData.baseOpacity = web.material.opacity;
        forestPropsGroup.add(web);
        webMeshes.push(web);
    }

}

function updateForestProps(dt, elapsed) {
    const moving = GAME_STATE.moveVelocity > 1.0;
    const forward = new THREE.Vector3(-Math.sin(GAME_STATE.cameraYaw), 0, -Math.cos(GAME_STATE.cameraYaw));
    fallenLeafActors.forEach((leaf) => {
        const dx = leaf.mesh.position.x - camera.position.x;
        const dz = leaf.mesh.position.z - camera.position.z;
        const distance = Math.hypot(dx, dz);
        if (moving && distance < 3.8) {
            const falloff = 1 - distance / 3.8;
            leaf.velocityX += forward.x * 0.9 * falloff * dt;
            leaf.velocityZ += forward.z * 0.9 * falloff * dt;
        }
        leaf.mesh.position.x += leaf.velocityX * dt;
        leaf.mesh.position.z += leaf.velocityZ * dt;
        leaf.velocityX *= Math.pow(0.04, dt);
        leaf.velocityZ *= Math.pow(0.04, dt);
        leaf.mesh.rotation.z += (leaf.velocityX + leaf.velocityZ) * dt * 2.4;
        leaf.mesh.position.y = leaf.baseY + Math.sin(elapsed * 0.7 + leaf.phase) * 0.002;
    });
    pondMeshes.forEach((pond) => {
        pond.mesh.material.opacity = pond.baseOpacity + Math.sin(elapsed * 0.6 + pond.phase) * 0.025;
    });
    webMeshes.forEach((web) => {
        const distance = Math.hypot(web.position.x - camera.position.x, web.position.z - camera.position.z);
        const visible = distance < 7.5;
        web.visible = visible;
        if (visible) web.material.opacity = web.userData.baseOpacity * (0.78 + Math.sin(elapsed * 1.1 + web.position.x) * 0.12);
    });
}

function createSpiderWebsBetweenPlants() {
    const anchors = realVegetationActors.filter((actor) => actor.object && actor.object.userData.assetType).slice(0, 900);
    const webMaterial = new THREE.LineBasicMaterial({ color: 0xc1d0c8, transparent: true, opacity: 0.3, depthWrite: false });
    const maxWebs = Math.min(180, Math.floor(anchors.length / 4));
    for (let i = 0; i < maxWebs; i++) {
        const a = anchors[(i * 17) % anchors.length];
        let b = null;
        let bestDistance = Infinity;
        for (let j = 1; j < 36; j++) {
            const candidate = anchors[(i * 17 + j * 13) % anchors.length];
            const distance = Math.hypot(candidate.x - a.x, candidate.z - a.z);
            if (distance > 2.5 && distance < 11.5 && distance < bestDistance) {
                b = candidate;
                bestDistance = distance;
            }
        }
        if (!b) continue;
        const width = bestDistance;
        const height = 0.52 + (i % 4) * 0.12;
        const vertices = [];
        for (let r = 0; r < 7; r++) {
            const theta = (r / 7) * Math.PI * 2;
            vertices.push(0, 0, 0, Math.cos(theta) * width * 0.5, Math.sin(theta) * height, 0);
        }
        for (let ring = 1; ring < 4; ring++) {
            const radius = ring / 4;
            for (let r = 0; r < 7; r++) {
                const t1 = (r / 7) * Math.PI * 2;
                const t2 = (((r + 1) % 7) / 7) * Math.PI * 2;
                vertices.push(Math.cos(t1) * width * 0.5 * radius, Math.sin(t1) * height * radius, 0, Math.cos(t2) * width * 0.5 * radius, Math.sin(t2) * height * radius, 0);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const web = new THREE.LineSegments(geometry, webMaterial.clone());
        web.position.set((a.x + b.x) * 0.5, terrainHeightAt((a.x + b.x) * 0.5, (a.z + b.z) * 0.5) + 0.85 + (i % 3) * 0.2, (a.z + b.z) * 0.5);
        web.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
        web.userData.baseOpacity = web.material.opacity;
        forestPropsGroup.add(web);
        webMeshes.push(web);
    }
}

function prepareRealAsset(root, targetHeight) {
    const invalidMeshes = [];
    root.traverse((node) => {
        if (!node.isMesh) return;
        const position = node.geometry && node.geometry.attributes && node.geometry.attributes.position;
        if (!position || !position.array || !Number.isFinite(position.count) || position.count === 0) {
            invalidMeshes.push(node);
            return;
        }
        for (let i = 0; i < position.array.length; i++) {
            if (!Number.isFinite(position.array[i])) {
                invalidMeshes.push(node);
                break;
            }
        }
        node.castShadow = true;
        node.receiveShadow = true;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((mat) => {
            if (!mat) return;
            if ('roughness' in mat) mat.roughness = Math.max(mat.roughness || 0.7, 0.74);
            if ('metalness' in mat) mat.metalness = 0.0;
            if (mat.alphaMode === 'MASK') mat.alphaTest = Math.max(mat.alphaTest || 0.35, 0.35);
            [mat.map, mat.normalMap, mat.roughnessMap, mat.metalnessMap].forEach((texture) => {
                if (!texture) return;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
            });
        });
    });
    invalidMeshes.forEach((node) => node.parent && node.parent.remove(node));
    root.updateMatrixWorld(true);
    const initialBox = new THREE.Box3().setFromObject(root);
    if (!Number.isFinite(initialBox.min.x) || !Number.isFinite(initialBox.min.y) || !Number.isFinite(initialBox.min.z) ||
        !Number.isFinite(initialBox.max.x) || !Number.isFinite(initialBox.max.y) || !Number.isFinite(initialBox.max.z)) {
        root.userData.forestInvalid = true;
        return root;
    }
    const height = Math.max(0.001, initialBox.max.y - initialBox.min.y);
    const scale = targetHeight / height;
    root.scale.multiplyScalar(scale);
    root.updateMatrixWorld(true);
    const scaledBox = new THREE.Box3().setFromObject(root);
    root.position.y -= scaledBox.min.y;
    return root;
}

function addRealVegetation(template, position, targetHeight, rotationY, type, radius) {
    if (!template || template.userData.forestInvalid) return null;
    if (!template.userData.forestPrepared) {
        prepareRealAsset(template, 1);
        template.userData.forestPrepared = true;
    }
    const instance = template.clone(true);
    instance.scale.multiplyScalar(targetHeight);
    instance.position.x = position.x;
    instance.position.z = position.z;
    instance.position.y = terrainHeightAt(position.x, position.z);
    instance.rotation.y = rotationY;
    instance.userData.assetType = type;
    realVegetationGroup.add(instance);
    realVegetationActors.push({ object: instance, x: position.x, z: position.z });
    if (type === 'TREE' || type === 'SHRUB') {
        interactiveObjects.push({ object: instance, position: new THREE.Vector3(position.x, 0, position.z), radius, type, touchedAt: -10 });
    }
    return instance;
}

function addInstancedVegetationSet(template, placements, name, parent = realVegetationGroup) {
    if (!template || template.userData.forestInvalid || !placements.length) return;
    if (!template.userData.forestPrepared) {
        prepareRealAsset(template, 1);
        template.userData.forestPrepared = true;
    }
    if (template.userData.forestInvalid) return;
    template.updateMatrixWorld(true);
    if (!template.userData.forestMeshNodes) {
        const meshNodes = [];
        template.traverse((node) => {
            if (!node.isMesh || !node.geometry || !node.geometry.attributes || !node.geometry.attributes.position || !node.geometry.attributes.position.array ||
                !node.matrixWorld || !node.matrixWorld.elements || node.matrixWorld.elements.some((value) => !Number.isFinite(value))) return;
            const position = node.geometry.attributes.position;
            for (let i = 0; i < position.array.length; i++) if (!Number.isFinite(position.array[i])) return;
            meshNodes.push({ geometry: node.geometry, material: node.material, matrix: node.matrixWorld.clone() });
        });
        template.userData.forestMeshNodes = meshNodes;
    }
    const meshNodes = template.userData.forestMeshNodes;
    const group = new THREE.Group();
    group.name = name;
    meshNodes.forEach((node, meshIndex) => {
        const instanced = new THREE.InstancedMesh(node.geometry, node.material, placements.length);
        instanced.name = `${name}_mesh_${meshIndex}`;
        instanced.castShadow = false;
        instanced.receiveShadow = false;
        const plantMatrix = new THREE.Matrix4();
        const finalMatrix = new THREE.Matrix4();
        const quaternion = new THREE.Quaternion();
        const scale = new THREE.Vector3();
        placements.forEach((placement, index) => {
            quaternion.setFromEuler(new THREE.Euler(0, placement.rotation, 0));
            scale.set(placement.height, placement.height, placement.height);
            plantMatrix.compose(new THREE.Vector3(placement.x, terrainHeightAt(placement.x, placement.z), placement.z), quaternion, scale);
            finalMatrix.multiplyMatrices(plantMatrix, node.matrix);
            instanced.setMatrixAt(index, finalMatrix);
        });
        instanced.instanceMatrix.needsUpdate = true;
        group.add(instanced);
    });
    parent.add(group);
    return group;
}

function vegetationHash(x, z, seed = 1) {
    const value = Math.sin(x * 127.1 + z * 311.7 + seed * 74.3) * 43758.5453;
    return value - Math.floor(value);
}

function buildWorldPlacements(templates, step, seed, makePlacement) {
    const sets = templates.map(() => []);
    if (!templates.length) return sets;
    let cell = 0;
    for (let z = -520 + step * 0.5; z < 24; z += step) {
        for (let x = -280 + step * 0.5; x < 280; x += step) {
            const jitterX = (vegetationHash(cell, seed, 11) - 0.5) * step * 0.65;
            const jitterZ = (vegetationHash(cell, seed, 17) - 0.5) * step * 0.65;
            const px = x + jitterX;
            const pz = z + jitterZ;
            if (forestDensityGap(px, pz)) { cell++; continue; }
            const index = Math.floor(vegetationHash(cell, seed, 23) * templates.length) % templates.length;
            sets[index].push(makePlacement(px, pz, cell));
            cell++;
        }
    }
    return sets;
}

function initVegetationStreaming(treeTemplates, undergrowthTemplates) {
    const smallTemplates = undergrowthTemplates.filter((template) => /fern|anthurium/i.test(template.name || ''));
    vegetationStreaming = {
        treeTemplates,
        undergrowthTemplates,
        smallTemplates: smallTemplates.length ? smallTemplates : undergrowthTemplates
    };
    const treeSets = buildWorldPlacements(treeTemplates, 20.5, 1, (x, z, index) => ({
        x, z, height: 8.5 + (index % 5) * 1.2, rotation: vegetationHash(index, 1, 31) * Math.PI * 2
    }));
    treeSets.forEach((placements) => placements.forEach((placement) => {
        if (Math.hypot(placement.x, placement.z - 8) > 10) {
            registerVegetationCollider(placement.x, placement.z, placement.height > 11 ? 2.2 : 1.5);
        }
    }));
    const mediumSets = buildWorldPlacements(undergrowthTemplates, isMobileDevice ? 28 : 24, 2, (x, z, index) => ({
        x, z, height: 1.2 + (index % 4) * 0.24, rotation: vegetationHash(index, 2, 37) * Math.PI * 2
    }));
    const smallSets = buildWorldPlacements(vegetationStreaming.smallTemplates, isMobileDevice ? 20 : 16, 3, (x, z, index) => ({
        x, z, height: 0.52 + (index % 5) * 0.11, rotation: vegetationHash(index, 3, 43) * Math.PI * 2
    }));

    treeSets.forEach((placements, index) => addInstancedVegetationSet(treeTemplates[index], placements, `World_Trees_${index}`));
    mediumSets.forEach((placements, index) => addInstancedVegetationSet(undergrowthTemplates[index], placements, `World_Medium_${index}`));
    smallSets.forEach((placements, index) => addInstancedVegetationSet(vegetationStreaming.smallTemplates[index], placements, `World_Small_${index}`));
}

function addRealWildlife(gltf, position, scale, type) {
    const instance = THREE.SkeletonUtils ? THREE.SkeletonUtils.clone(gltf.scene) : gltf.scene.clone(true);
    instance.updateMatrixWorld(true);
    const initialBox = new THREE.Box3().setFromObject(instance);
    const initialHeight = Math.max(0.001, initialBox.max.y - initialBox.min.y);
    instance.scale.multiplyScalar(scale / initialHeight);
    instance.updateMatrixWorld(true);
    const scaledBox = new THREE.Box3().setFromObject(instance);
    instance.position.copy(position);
    instance.position.y -= scaledBox.min.y;
    instance.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
    });
    realWildlifeGroup.add(instance);
    realWildlifeActors.push({ object: instance, type, base: position.clone(), phase: Math.random() * Math.PI * 2 });
    if (gltf.animations && gltf.animations.length) {
        const mixer = new THREE.AnimationMixer(instance);
        const preferred = gltf.animations.find((clip) => /walk|run|idle/i.test(clip.name)) || gltf.animations[0];
        mixer.clipAction(preferred).play();
        realWildlifeMixers.push(mixer);
    }
    const audioTarget = audioWildlife.find((entry) => entry.type === type && !entry.object);
    if (audioTarget) audioTarget.object = instance;
    return instance;
}

    const setProgress = (value) => { if (progressBar) progressBar.style.width = `${value}%`; };
    setProgress(12);
    const results = await Promise.allSettled([
        loadGLTFAsset('assets/models/realistic/island_tree_01_draco.glb'),

    const [treeResult, pachiraResult, fernResult, shrubResult, anthuriumResult] = results;

function disposeProceduralFallback() {
    if (!proceduralVegetationGroup) return;
    const geometries = new Set();
    const materials = new Set();
    proceduralVegetationGroup.traverse((node) => {
        if (node.geometry) geometries.add(node.geometry);
        if (node.material) {
            (Array.isArray(node.material) ? node.material : [node.material]).forEach((material) => materials.add(material));
        }
    });
    proceduralVegetationGroup.parent && proceduralVegetationGroup.parent.remove(proceduralVegetationGroup);
    geometries.forEach((geometry) => geometry.dispose());
    materials.forEach((material) => material.dispose());
    windMaterials.length = 0;
    proceduralVegetationGroup = null;
}

function createOrganicSplineMesh(controlPoints, radialSegments, tubularSegments, material, profileModFn) {
    const curve = new THREE.CatmullRomCurve3(controlPoints.map(p => new THREE.Vector3(p[0], p[1], p[2])));
    const frames = curve.computeFrenetFrames(tubularSegments, false);
    const positions = [];
    const uvs = [];
    const indices = [];

    for (let i = 0; i <= tubularSegments; i++) {
        const u = i / tubularSegments;
        const pt = curve.getPointAt(u);
        const N = frames.normals[i];
        const B = frames.binormals[i];

        const fIdx = u * (controlPoints.length - 1);
        const idx0 = Math.floor(fIdx);
        const idx1 = Math.min(controlPoints.length - 1, idx0 + 1);
        const frac = fIdx - idx0;
        const rx = THREE.MathUtils.lerp(controlPoints[idx0][3], controlPoints[idx1][3], frac);
        const ry = THREE.MathUtils.lerp(
            controlPoints[idx0][4] !== undefined ? controlPoints[idx0][4] : controlPoints[idx0][3],
            controlPoints[idx1][4] !== undefined ? controlPoints[idx1][4] : controlPoints[idx1][3],
            frac
        );

        for (let j = 0; j <= radialSegments; j++) {
            const v = j / radialSegments;
            const theta = v * Math.PI * 2;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);

            const mod = profileModFn ? profileModFn(u, theta) : 1.0;
            const rH = rx * mod;
            const rV = ry * mod;

            const vx = pt.x + (N.x * cosT * rH + B.x * sinT * rV);
            const vy = pt.y + (N.y * cosT * rH + B.y * sinT * rV);
            const vz = pt.z + (N.z * cosT * rH + B.z * sinT * rV);

            positions.push(vx, vy, vz);
            uvs.push(u * 3.0, v * 2.0);
        }
    }

    const stride = radialSegments + 1;
    for (let i = 0; i < tubularSegments; i++) {
        for (let j = 0; j < radialSegments; j++) {
            const a = i * stride + j;
            const b = (i + 1) * stride + j;
            const c = (i + 1) * stride + (j + 1);
            const d = i * stride + (j + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

function buildFirstPersonHands() {
    if (handsGroup) {
        camera.remove(handsGroup);
    }
    handsGroup = new THREE.Group();
    leftFingers = [];
    rightFingers = [];

    const isFemale = GAME_STATE.gender === 'female';
    const skinTone = isFemale ? 0xb9826e : 0x996e5b;
    const scale = isFemale ? 0.88 : 1.0;

    // Matte, natural human dermis material (no glossy plastic clearcoat)
    const skinMat = new THREE.MeshPhysicalMaterial({
        color: skinTone,
        roughness: 0.86,
        metalness: 0.0,
        reflectivity: 0.22,
        clearcoat: 0.0,
        bumpMap: textures.skinBump,
        bumpScale: 0.00065
    });

    const nailMat = new THREE.MeshStandardMaterial({
        color: 0xe8c5b5,
        roughness: 0.58,
        metalness: 0.0
    });

    const cuffMat = new THREE.MeshStandardMaterial({
        color: isFemale ? 0x1e3a2f : 0x2b2118,
        roughness: 0.96,
        bumpMap: textures.barkTex,
        bumpScale: 0.008
    });

    function buildSingleHand(isLeft) {
        const handRoot = new THREE.Group();
        const side = isLeft ? -1 : 1;

        // Forearm + wrist + metacarpal palm sculpted smoothly
        const forearmPalmPts = [
            [side * 0.05 * scale, -0.22 * scale, 0.32, 0.044 * scale, 0.038 * scale],
            [side * 0.02 * scale, -0.11 * scale, 0.14, 0.036 * scale, 0.029 * scale],
            [0.0,                 -0.03 * scale, 0.03, 0.042 * scale, 0.020 * scale],
            [0.0,                  0.00,        -0.055 * scale, 0.046 * scale, 0.016 * scale]
        ];
        const palmMesh = createOrganicSplineMesh(forearmPalmPts, 28, 36, skinMat, (u, theta) => {
            const knuckleArch = u > 0.7 ? Math.sin(theta * 4.0) * 0.035 : 0.0;
            return 1.0 + knuckleArch;
        });
        handRoot.add(palmMesh);

        const knuckleGeo = new THREE.SphereGeometry(0.011 * scale, 12, 10);
        [-0.028, -0.009, 0.010, 0.029].forEach((offset, idx) => {
            const knuckle = new THREE.Mesh(knuckleGeo, skinMat);
            knuckle.position.set((isLeft ? -offset : offset) * scale, 0.005 + idx * 0.0005, -0.056 * scale);
            knuckle.scale.set(1.0, 0.72, 0.82);
            handRoot.add(knuckle);
        });

        // Woven expedition wrist wrap
        const cuffPts = [
            [side * 0.03 * scale, -0.15 * scale, 0.21, 0.043 * scale, 0.036 * scale],
            [side * 0.015 * scale, -0.09 * scale, 0.11, 0.039 * scale, 0.032 * scale]
        ];
        const cuffMesh = createOrganicSplineMesh(cuffPts, 22, 14, cuffMat);
        handRoot.add(cuffMesh);

        // Thumb (3-segment anatomical)
        const thumbPivot = new THREE.Group();
        thumbPivot.position.set(-side * 0.038 * scale, -0.012 * scale, -0.01 * scale);
        const thumbPts = [
            [0, 0, 0, 0.015 * scale, 0.014 * scale],
            [-side * 0.022 * scale, -0.006 * scale, -0.032 * scale, 0.012 * scale, 0.011 * scale],
            [-side * 0.034 * scale, -0.015 * scale, -0.062 * scale, 0.009 * scale, 0.008 * scale]
        ];
        thumbPivot.add(createOrganicSplineMesh(thumbPts, 16, 18, skinMat));
        handRoot.add(thumbPivot);

        // 4 Articulated Fingers (Index, Middle, Ring, Pinky)
        const fingerConfigs = [
            { xOffset: -0.031, len: 0.066, baseCurl: 0.18 },
            { xOffset: -0.010, len: 0.074, baseCurl: 0.15 },
            { xOffset:  0.011, len: 0.069, baseCurl: 0.20 },
            { xOffset:  0.031, len: 0.054, baseCurl: 0.26 }
        ];

        const fingerStore = isLeft ? leftFingers : rightFingers;

        fingerConfigs.forEach((fc, idx) => {
            const fGroup = new THREE.Group();
            const fx = (isLeft ? -fc.xOffset : fc.xOffset) * scale;
            fGroup.position.set(fx, 0.0, -0.055 * scale);

            const L = fc.len * scale;
            const pts = [
                [0, 0, 0, 0.0105 * scale, 0.0095 * scale],
                [0, -0.005, -L * 0.38, 0.009 * scale, 0.0085 * scale],
                [0, -0.014, -L * 0.72, 0.0078 * scale, 0.0072 * scale],
                [0, -0.024, -L * 1.00, 0.0062 * scale, 0.0054 * scale]
            ];
            const fMesh = createOrganicSplineMesh(pts, 16, 20, skinMat, (u) => {
                // Subtle knuckle joint swell
                const joint1 = Math.exp(-Math.pow((u - 0.38) * 14, 2)) * 0.09;
                const joint2 = Math.exp(-Math.pow((u - 0.72) * 14, 2)) * 0.07;
                return 1.0 + joint1 + joint2;
            });
            fGroup.add(fMesh);

            // Anatomical fingernail
            const nail = new THREE.Mesh(new THREE.SphereGeometry(0.005 * scale, 12, 10), nailMat);
            nail.scale.set(0.85, 0.22, 1.35);
            nail.rotation.x = 0.28;
            nail.position.set(0, -0.021, -L * 0.96);
            fGroup.add(nail);

            fGroup.rotation.x = fc.baseCurl;
            handRoot.add(fGroup);
            fingerStore.push({ group: fGroup, baseCurl: fc.baseCurl, phase: idx * 0.45 });
        });

        // Natural first-person framing in lower viewport
        handRoot.position.set(side * 0.22, -0.23, -0.48);
        handRoot.rotation.set(0.22, -side * 0.24, side * 0.08);
        return handRoot;
    }

    leftHandGroup = buildSingleHand(true);
    rightHandGroup = buildSingleHand(false);
    handsGroup.add(leftHandGroup, rightHandGroup);

    // Soft fill light for near foliage & hands
    lanternLight = new THREE.PointLight(0xffd0a3, 0.18, 8, 2.0);
    lanternLight.position.set(0, 0.1, -0.3);
    handsGroup.add(lanternLight);

    camera.add(handsGroup);
    scene.add(camera);
}

function populateWANDERLVSTRainforest() {

        roughness: 0.86,
        metalness: 0.0
    });
    enhanceFoliageMaterial(canopyMat, 0x8fb79a, 0.12, 0.055);

    // Fern frond material (multi-leaflet alpha cutout)
    const fernMat = new THREE.MeshStandardMaterial({
        map: textures.fernTex,

        side: THREE.DoubleSide,

    });

    // Monstera split-leaf material
    const monsteraMat = new THREE.MeshStandardMaterial({
        map: textures.monsteraTex,
        alphaTest: 0.3,
        transparent: false,
        side: THREE.DoubleSide,
        roughness: 0.82,
        metalness: 0.0
    });
    enhanceFoliageMaterial(monsteraMat, 0x8dbb96, 0.14, 0.04);

    // 1. Pre-build 3 Organic Fluted Buttress-Root Tree Trunk Variations
    const trunkGeos = [0, 1, 2].map(seed => {
        const geo = new THREE.CylinderGeometry(0.45, 1.75, 22, 28, 28, false);
        geo.translate(0, 11, 0);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
            const hNorm = vy / 22.0;
            const angle = Math.atan2(vz, vx);
            // Fluted buttress roots flaring at the base
            const buttress = Math.pow(Math.max(0, 1.0 - hNorm * 2.2), 2.2) * Math.sin(angle * 5.0 + seed * 1.7) * 0.78;
            const rScale = Math.max(0.28, 1.0 + buttress);
            const bendX = Math.sin(hNorm * Math.PI + seed) * 0.75;
            const bendZ = Math.cos(hNorm * Math.PI + seed) * 0.55;
            pos.setXYZ(i, vx * rScale + bendX, vy, vz * rScale + bendZ);
        }
        geo.computeVertexNormals();
        return geo;
    });

    const canopyBoughGeo = new THREE.PlaneGeometry(9.0, 9.0, 4, 4);
    canopyBoughGeo.rotateX(Math.PI / 2);

    // Spawn 420 Multi-Sized Rainforest Trees (Giant Emergent, Mid-Canopy, and Young Saplings)
    for (let i = 0; i < (isMobileDevice ? 70 : 180); i++) {
        const x = (Math.random() - 0.5) * 280;
        const z = -Math.random() * 500 + 18;
        // Leave initial spawn clearing open
        if (Math.hypot(x, z) < 6.5) continue;
        // Leave central Sanctuary lagoon meadow open for vistas
        if (z < -195 && Math.abs(x) < 16) continue;

        const treeGroup = new THREE.Group();
        const sizeTier = Math.random();
        let scaleR = 1.0, scaleH = 1.0;

        if (sizeTier < 0.28) {
            // Colossal Emergent Kapok / Banyan Tree
            scaleR = 1.25 + Math.random() * 0.6;
            scaleH = 1.15 + Math.random() * 0.45;
        } else if (sizeTier < 0.72) {
            // Mid-Canopy Jungle Tree
            scaleR = 0.65 + Math.random() * 0.45;
            scaleH = 0.75 + Math.random() * 0.35;
        } else {
            // Slender Young Understory Tree
            scaleR = 0.28 + Math.random() * 0.25;
            scaleH = 0.42 + Math.random() * 0.28;
        }

        const trunk = new THREE.Mesh(trunkGeos[i % 3], barkMat);
        trunk.scale.set(scaleR, scaleH, scaleR);
        trunk.rotation.y = Math.random() * Math.PI * 2;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        treeGroup.add(trunk);

        // Layered leafy canopy crown
        const crownY = 20.5 * scaleH;
        const boughCount = sizeTier > 0.72 ? 3 : 6;
        for (let b = 0; b < boughCount; b++) {
            const bough = new THREE.Mesh(canopyBoughGeo, canopyMat);
            const bScale = scaleR * (0.85 + Math.random() * 0.5);
            bough.scale.set(bScale, bScale, bScale);
            bough.position.set(
                (Math.random() - 0.5) * 4.0 * scaleR,
                crownY - 1.5 + b * 0.8,
                (Math.random() - 0.5) * 4.0 * scaleR
            );
            bough.rotation.z = (Math.random() - 0.5) * 0.35;
            bough.rotation.y = Math.random() * Math.PI * 2;
            treeGroup.add(bough);
        }

        treeGroup.position.set(x, terrainHeightAt(x, z), z);
        proceduralVegetationGroup.add(treeGroup);
    }

    // 2. Arched Parabolic Fern Frond Geometry (for Ground Ferns & Dwarf Palms)
    const archedFrondGeo = new THREE.PlaneGeometry(0.85, 2.2, 4, 14);
    archedFrondGeo.translate(0, 1.1, 0);
    const fPos = archedFrondGeo.attributes.position;
    for (let i = 0; i < fPos.count; i++) {
        const fx = fPos.getX(i), fy = fPos.getY(i);
        const t = Math.max(0, Math.min(1, fy / 2.2));
        const archZ = Math.pow(t, 1.55) * 1.15;
        const archY = fy * (1.0 - t * 0.28) + Math.abs(fx) * 0.14;
        fPos.setXYZ(i, fx, archY, archZ);
    }
    archedFrondGeo.computeVertexNormals();

    // Spawn 140 Understory Dwarf Fan Palms & Tree Ferns (Mid-height 2.5m - 4.5m)
    const palmStemGeo = new THREE.CylinderGeometry(0.12, 0.22, 2.6, 10, 8);
    palmStemGeo.translate(0, 1.3, 0);
    for (let i = 0; i < (isMobileDevice ? 40 : 80); i++) {
        const px = (Math.random() - 0.5) * 240;
        const pz = -Math.random() * 490 + 10;
        if (Math.hypot(px, pz) < 5.0) continue;

        const palmGroup = new THREE.Group();
        const stemH = 0.7 + Math.random() * 0.9;
        const stem = new THREE.Mesh(palmStemGeo, barkMat);
        stem.scale.set(1, stemH, 1);
        palmGroup.add(stem);

        const crownFronds = 9 + Math.floor(Math.random() * 5);
        for (let f = 0; f < crownFronds; f++) {
            const frond = new THREE.Mesh(archedFrondGeo, fernMat);
            frond.position.y = 2.5 * stemH;
            frond.rotation.y = (f / crownFronds) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
            const fs = 1.1 + Math.random() * 0.5;
            frond.scale.set(fs, fs, fs);
            palmGroup.add(frond);
        }
        palmGroup.position.set(px, terrainHeightAt(px, pz), pz);
        proceduralVegetationGroup.add(palmGroup);
    }

    // 3. Spawn 900 Multi-Frond Ground Ferns & Broadleaf Monstera Clusters
    const monsteraLeafGeo = new THREE.PlaneGeometry(1.1, 1.35, 5, 5);
    monsteraLeafGeo.translate(0, 0.67, 0);
    const mPos = monsteraLeafGeo.attributes.position;
    for (let i = 0; i < mPos.count; i++) {
        const mx = mPos.getX(i), my = mPos.getY(i);
        const t = my / 1.35;
        mPos.setZ(i, Math.pow(t, 1.4) * 0.55 - Math.abs(mx) * 0.15);
    }
    monsteraLeafGeo.computeVertexNormals();

    for (let i = 0; i < (isMobileDevice ? 180 : 320); i++) {
        const gx = (Math.random() - 0.5) * 250;
        const gz = -Math.random() * 500 + 12;
        if (Math.hypot(gx, gz) < 3.5) continue;

        const cluster = new THREE.Group();
        const isMonstera = Math.random() > 0.58;
        const count = isMonstera ? (5 + Math.floor(Math.random() * 4)) : (8 + Math.floor(Math.random() * 6));

        for (let c = 0; c < count; c++) {
            const leafMesh = new THREE.Mesh(isMonstera ? monsteraLeafGeo : archedFrondGeo, isMonstera ? monsteraMat : fernMat);
            leafMesh.rotation.y = (c / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
            const s = 0.55 + Math.random() * 0.75;
            leafMesh.scale.set(s, s, s);
            cluster.add(leafMesh);
        }

        cluster.position.set(gx, terrainHeightAt(gx, gz) + 0.02, gz);
        proceduralVegetationGroup.add(cluster);
    }

    // 4. Hanging Canopy Liana Vines & Fallen Mossy Logs
    const vineGeo = new THREE.CylinderGeometry(0.035, 0.045, 16, 6, 12);
    vineGeo.translate(0, -8, 0);
    const vPos = vineGeo.attributes.position;
    for (let i = 0; i < vPos.count; i++) {
        const vy = vPos.getY(i);
        vPos.setX(i, vPos.getX(i) + Math.sin(vy * 0.6) * 0.35);
        vPos.setZ(i, vPos.getZ(i) + Math.cos(vy * 0.5) * 0.35);
    }
    vineGeo.computeVertexNormals();

    for (let v = 0; v < (isMobileDevice ? 45 : 90); v++) {
        const vine = new THREE.Mesh(vineGeo, barkMat);
        const vineX = (Math.random() - 0.5) * 300;
        const vineZ = -Math.random() * 500;
        vine.position.set(vineX, terrainHeightAt(vineX, vineZ) + 16 + Math.random() * 6, vineZ);
        vine.rotation.y = Math.random() * Math.PI * 2;
        proceduralVegetationGroup.add(vine);
    }

    // 5. Volumetric Sunbeams ("God Rays" piercing the emerald canopy like WANDERLVST reference)
    const rayGeo = new THREE.ConeGeometry(4.5, 28, 16, 1, true);
    rayGeo.translate(0, -14, 0);
    const rayMat = new THREE.ShaderMaterial({
        uniforms: {
            uColor: { value: new THREE.Color(0xc0c9a8) },
            uTime: { value: 0 }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform vec3 uColor;
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                float fadeVert = sin(vUv.y * 3.14159);
                float shimmer = 0.85 + 0.15 * sin(uTime * 1.5 + vUv.x * 12.0);
                float alpha = fadeVert * 0.018 * shimmer;
                gl_FragColor = vec4(uColor, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
    });

    for (let r = 0; r < 42; r++) {
        const ray = new THREE.Mesh(rayGeo, rayMat);
        ray.position.set((Math.random() - 0.5) * 180, 24, -Math.random() * 270);
        ray.rotation.z = -0.28;
        ray.rotation.x = 0.18;
        scene.add(ray);
        volumetricRays.push(ray);
    }
}

function buildSanctuaryParadiseValley() {
    // Winding Crystal River with animated water ripples
    const riverGeo = new THREE.PlaneGeometry(18, 220, 48, 96);
    riverGeo.rotateX(-Math.PI / 2);

    riverShaderMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                pos.x += sin(pos.z * 0.055) * 4.8 + sin(pos.z * 0.13) * 0.8;
                pos.y += sin(pos.z * 0.22) * 0.025;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                vec2 uv = vUv * vec2(7.0, 42.0);
                float flow = sin(uv.y - uTime * 2.25 + sin(uv.x * 2.1 + uTime * 0.35));
                float cross = cos(uv.x * 4.0 - uv.y * 0.42 - uTime * 1.25);
                float micro = sin(uv.y * 2.8 + uv.x * 8.0 - uTime * 2.8);
                float spec = smoothstep(0.72, 0.98, flow * 0.52 + cross * 0.28 + micro * 0.2);
                float bank = smoothstep(0.0, 0.16, vUv.x) * smoothstep(1.0, 0.84, vUv.x);
                vec3 deepCol = vec3(0.012, 0.055, 0.075);
                vec3 shallowCol = vec3(0.035, 0.16, 0.18);
                vec3 reflectionCol = vec3(0.37, 0.53, 0.58);
                vec3 finalCol = mix(deepCol, shallowCol, 0.42 + flow * 0.2);
                finalCol += reflectionCol * spec * 0.22;
                float foam = smoothstep(0.82, 0.98, abs(cross + flow * 0.35));
                finalCol = mix(finalCol, vec3(0.63, 0.75, 0.75), foam * 0.1);
                gl_FragColor = vec4(finalCol, 0.72 * bank);
            }
        `,
        transparent: true,
        side: THREE.DoubleSide
    });

    const riverMesh = new THREE.Mesh(riverGeo, riverShaderMat);
    riverMesh.position.set(4, 0.04, -300);
    scene.add(riverMesh);

    // Towering Mossy Cliffs & Foaming Waterfall at Z = -305
    const cliffMat = new THREE.MeshStandardMaterial({
        map: textures.barkTex,
        roughness: 0.9,
        color: 0x1e2923
    });
    for (let c = 0; c < 14; c++) {
        const cliffGeo = new THREE.CylinderGeometry(4 + Math.random() * 5, 7 + Math.random() * 6, 36 + Math.random() * 15, 12);
        const cliff = new THREE.Mesh(cliffGeo, cliffMat);
        const cx = (c - 6.5) * 11;
        cliff.position.set(cx, 19, -420 - Math.abs(cx) * 0.15);
        scene.add(cliff);
    }

    const fallsGeo = new THREE.PlaneGeometry(18, 48, 24, 48);
    waterfallShaderMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                float ribbons = sin(vUv.x * 34.0 + sin(vUv.y * 8.0) * 1.8 - uTime * 2.7) * 0.5 + 0.5;
                float droplets = fract(vUv.y * 8.0 + uTime * 2.4 + sin(vUv.x * 9.0));
                float mist = smoothstep(0.22, 0.0, vUv.y) * 0.6;
                float foam = smoothstep(0.72, 0.98, ribbons * (1.0 - droplets * 0.38) + mist);
                vec3 water = mix(vec3(0.07, 0.28, 0.32), vec3(0.56, 0.72, 0.75), foam);
                float edge = smoothstep(0.0, 0.12, vUv.x) * smoothstep(1.0, 0.88, vUv.x);
                float alpha = edge * (0.36 + foam * 0.42);
                gl_FragColor = vec4(water, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
    });
    const fallsMesh = new THREE.Mesh(fallsGeo, waterfallShaderMat);
    fallsMesh.position.set(4, 24, -420);
    scene.add(fallsMesh);

    // Multi-Petal Exotic Rainforest Flowers (Heliconia, Orchids, Lotus) throughout Jungle & Valley
    const petalGeo = new THREE.PlaneGeometry(0.16, 0.34, 2, 4);
    petalGeo.translate(0, 0.17, 0);
    const pPos = petalGeo.attributes.position;
    for (let i = 0; i < pPos.count; i++) {
        const py = pPos.getY(i);
        pPos.setZ(i, Math.pow(py / 0.34, 1.6) * 0.12);
    }
    petalGeo.computeVertexNormals();

    const flowerColors = [0x9e5d62, 0xb38b4b, 0x75628d, 0x5f7f82, 0xa36c4e];
    const flowerMats = flowerColors.map(col => new THREE.MeshStandardMaterial({
        color: col,
        roughness: 0.86,
        metalness: 0.0,
        side: THREE.DoubleSide
    }));

    for (let f = 0; f < (isMobileDevice ? 60 : 120); f++) {
        const inValley = f < 120;
        const fx = inValley ? ((Math.random() - 0.5) * 95 + 4) : ((Math.random() - 0.5) * 200);
        const fz = inValley ? (-190 - Math.random() * 105) : (-Math.random() * 190);
        const blossom = new THREE.Group();
        const mat = flowerMats[f % flowerMats.length];

        for (let p = 0; p < 6; p++) {
            const petal = new THREE.Mesh(petalGeo, mat);
            petal.rotation.y = (p / 6) * Math.PI * 2;
            petal.rotation.x = 0.45;
            blossom.add(petal);
        }
        blossom.position.set(fx, 0.25 + Math.random() * 0.4, fz);
        const bs = 0.8 + Math.random() * 0.7;
        blossom.scale.set(bs, bs, bs);
        scene.add(blossom);
    }
}

        [-0.14, 0.14].forEach(fx => {

                [fx, 0.78, 1.48, 0.004, 0.004]

            group.add(createOrganicSplineMesh(fangPts, 12, 16, toothMat));
        });

        [-0.16, 0.16].forEach(ex => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), eyeMat);
            eye.position.set(ex, 1.42, 1.52);
            group.add(eye);
        });

        [[-0.36, 0.55], [0.36, 0.55], [-0.32, -0.65], [0.32, -0.65]].forEach(([lx, lz], idx) => {
            const legPivot = new THREE.Group();
            legPivot.position.set(lx, 1.08, lz);

                [0, -0.55, -0.05, 0.15, 0.16],
                [0, -1.08, 0.12, 0.14, 0.09]
            ];
            legPivot.add(createOrganicSplineMesh(lPts, 16, 20, furMat));
            group.add(legPivot);
            group.userData.limbs.push({ pivot: legPivot, phase: idx * Math.PI * 0.5 });

    } else if (type === 'TERROR_BIRD') {

        const beakPts = [
            [0, 2.65, 1.05, 0.16, 0.22],

    return group;
