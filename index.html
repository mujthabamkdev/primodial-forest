function initThreeScene() {
    createBotanicalAndSurfaceTextures();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x01040a);
    scene.fog = new THREE.FogExp2(0x071018, 0.0048);
    createNightSky();

    // Crisp, natural 52-degree vertical FOV (Not zoomed-in, zero blur)
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 700);
    camera.position.set(0, 1.7, 8);

    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice ? 1.0 : 1.15));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.74;
    renderer.shadowMap.enabled = false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.getElementById('canvas-container').appendChild(renderer.domElement);
    clock = new THREE.Clock();

    // Rich Emerald/Golden Canopy Hemisphere & Sun Lighting
    hemiLight = new THREE.HemisphereLight(0x29445b, 0x020605, 0.28);
    scene.add(hemiLight);

    sunLight = new THREE.DirectionalLight(0x91afd0, 0.78);
    sunLight.position.set(45, 75, -60);
    sunLight.castShadow = false;
    sunLight.shadow.mapSize.width = 256;
    sunLight.shadow.mapSize.height = 256;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 260;
    const d = 90;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.00015;
    sunLight.shadow.normalBias = 0.025;
    sunLight.shadow.radius = 2.5;
    scene.add(sunLight);

    fillLight = new THREE.DirectionalLight(0x2d5365, 0.14);
    fillLight.position.set(-42, 18, 28);
    scene.add(fillLight);

    // Undulating Rainforest Floor with natural root mounds & hollows
    const groundSegments = isMobileDevice ? 96 : 128;
    const groundGeo = new THREE.PlaneGeometry(1100, 1100, groundSegments, groundSegments);
    groundGeo.rotateX(-Math.PI / 2);
    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
        const gx = gPos.getX(i), gz = gPos.getZ(i);
        // Keep river bed flat in Sanctuary
        if (gz < -180 && Math.abs(gx - 4) < 12) continue;
        const mound = Math.sin(gx * 0.08) * Math.cos(gz * 0.08) * 0.35 + Math.sin(gx * 0.25 + gz * 0.2) * 0.12;
        gPos.setY(i, mound);
    }
    groundGeo.computeVertexNormals();

    groundMaterial = new THREE.MeshStandardMaterial({
        map: textures.groundTex,
        bumpMap: textures.groundTex,
        bumpScale: 0.06,
        roughness: 0.92,
        metalness: 0.0
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMaterial);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);
    createRainPuddles();

    // 1. Tropical Rainforest Downpour & Puddle Ripple Rings
    const rainGeo = new THREE.BufferGeometry();
    const rainCount = isMobileDevice ? 700 : 1800;
    const rainPos = new Float32Array(rainCount * 6);
    for (let i = 0; i < rainCount * 6; i += 6) {
        const rx = (Math.random() - 0.5) * 55;
        const ry = Math.random() * 24;
        const rz = (Math.random() - 0.5) * 55;
        rainPos[i] = rx; rainPos[i+1] = ry; rainPos[i+2] = rz;
        rainPos[i+3] = rx - 0.04; rainPos[i+4] = ry - 0.85; rainPos[i+5] = rz;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    rainSystem = new THREE.LineSegments(
        rainGeo,
        new THREE.LineBasicMaterial({ color: 0xb8d2ce, transparent: true, opacity: 0.24, depthWrite: false })
    );
    scene.add(rainSystem);

    // Expanding 3D Water Splash Ripples on the Ground
    const rippleGeo = new THREE.RingGeometry(0.08, 0.48, 20);
    rippleGeo.rotateX(-Math.PI / 2);
    for (let i = 0; i < 28; i++) {
        const rMesh = new THREE.Mesh(
            rippleGeo,
            new THREE.MeshStandardMaterial({ color: 0x8faeaa, roughness: 0.98, transparent: true, opacity: 0, side: THREE.DoubleSide })
        );
        rMesh.position.y = 0.06;
        scene.add(rMesh);
        splashRipples.push({ mesh: rMesh, active: false, age: 0, maxAge: 0.65 });
    }

    // 2. WANDERLVST Shimmering Floating Bioluminescent Pollen / Spores
    const sporeGeo = new THREE.BufferGeometry();
    const sporeCount = isMobileDevice ? 150 : 400;
    const sporePos = new Float32Array(sporeCount * 3);
    for (let i = 0; i < sporeCount * 3; i += 3) {
        sporePos[i] = (Math.random() - 0.5) * 160;
        sporePos[i+1] = 0.3 + Math.random() * 10.0;
        sporePos[i+2] = -Math.random() * 290 + 15;
    }
    sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
    sporeSystem = new THREE.Points(
        sporeGeo,
        new THREE.PointsMaterial({ color: 0xb5c9a4, size: 0.08, transparent: true, opacity: 0.26, depthWrite: false })
    );
    scene.add(sporeSystem);

    proceduralVegetationGroup = new THREE.Group();
    proceduralVegetationGroup.name = 'Procedural_Vegetation_Fallback';
    scene.add(proceduralVegetationGroup);
    populateWANDERLVSTRainforest();
    createForestProps();
    buildSanctuaryParadiseValley();
    populateWildlifeAndInsects();
    buildFirstPersonHands();
    loadRealWorldAssets();

    window.addEventListener('resize', onWindowResize);
}

const keys = { w: false, a: false, s: false, d: false };
let joystickVector = { x: 0, y: 0 };
let isPointerDown = false;
let prevPointer = { x: 0, y: 0 };

function updateRunButtonUI() {
    const runBtn = document.getElementById('run-toggle-btn');
    if (GAME_STATE.sprint) {
        runBtn.textContent = "RUN: ON";
        runBtn.classList.add('active');
    } else {
        runBtn.textContent = "RUN: OFF";
        runBtn.classList.remove('active');
    }
}

function updateInteractiveProximity() {
    if (!camera) return null;
    if (!interactiveObjects.length) {
        GAME_STATE.touchTarget = null;
        return null;
    }
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
    let nearest = null;
    let nearestScore = Infinity;
    interactiveObjects.forEach((entry) => {
        if (!entry.object || !entry.object.visible) return;
        const dx = entry.position.x - camera.position.x;
        const dz = entry.position.z - camera.position.z;
        const distance = Math.hypot(dx, dz);
        if (distance > entry.radius + 2.8 || distance < 0.001) return;
        const direction = new THREE.Vector3(dx / distance, 0, dz / distance);
        const facing = forward.dot(direction);
        if (facing < -0.1) return;
        const score = distance - facing * 1.25;
        if (score < nearestScore) {
            nearestScore = score;
            nearest = { entry, distance, facing };
        }
    });
    GAME_STATE.touchTarget = nearest;
    return nearest;
}

function resolveWorldCollision(nextPosition) {
    let blocked = false;
    interactiveObjects.forEach((entry) => {
        if (!entry.object || !entry.object.visible) return;
        const dx = nextPosition.x - entry.position.x;
        const dz = nextPosition.z - entry.position.z;
        const distance = Math.hypot(dx, dz);
        const minimum = entry.radius + 0.72;
        if (distance >= minimum || distance < 0.001) return;
        const invDistance = 1 / distance;
        nextPosition.x = entry.position.x + dx * invDistance * minimum;
        nextPosition.z = entry.position.z + dz * invDistance * minimum;
        blocked = true;
    });
    const cellX = Math.floor(nextPosition.x / VEGETATION_COLLISION_CELL);
    const cellZ = Math.floor(nextPosition.z / VEGETATION_COLLISION_CELL);
    for (let dzCell = -1; dzCell <= 1; dzCell++) {
        for (let dxCell = -1; dxCell <= 1; dxCell++) {
            const colliders = vegetationCollisionGrid.get(`${cellX + dxCell}:${cellZ + dzCell}`);
            if (!colliders) continue;
            colliders.forEach((collider) => {
                const dx = nextPosition.x - collider.x;
                const dz = nextPosition.z - collider.z;
                const distance = Math.hypot(dx, dz);
                const minimum = collider.radius + 0.72;
                if (distance >= minimum) return;
                const safeDistance = Math.max(distance, 0.001);
                const nx = distance > 0.001 ? dx / safeDistance : 1;
                const nz = distance > 0.001 ? dz / safeDistance : 0;
                nextPosition.x = collider.x + nx * minimum;
                nextPosition.z = collider.z + nz * minimum;
                blocked = true;
            });
        }
    }
    GAME_STATE.isTrapped = blocked && !!GAME_STATE.touchTarget;
    return blocked;
}

function touchNearbyObject() {
    const target = updateInteractiveProximity();
    if (!target) return;
    GAME_STATE.touchPulse = 1.0;
    const now = clock ? clock.getElapsedTime() : 0;
    if (now - target.entry.touchedAt < 0.45) return;
    target.entry.touchedAt = now;
    if (target.entry.object.userData && target.entry.object.userData.assetType) {
        const rustle = target.entry.object.userData.assetType === 'TREE' ? 0.12 : 0.22;
        target.entry.object.rotation.z = rustle;
        setTimeout(() => {
            if (target.entry.object) target.entry.object.rotation.z = 0;
        }, 260);
    }
}

function updateFearAtmosphere(dt, elapsed) {
    let threat = 0;
    HAZARD_ZONES.forEach((hazard) => {
        const distance = Math.hypot(camera.position.x - hazard.x, camera.position.z - hazard.z);
        threat = Math.max(threat, THREE.MathUtils.clamp(1 - distance / 42, 0, 1));
    });
    audioWildlife.forEach((event) => {
        const distance = Math.hypot(camera.position.x - event.position.x, camera.position.z - event.position.z);
        threat = Math.max(threat, THREE.MathUtils.clamp(1 - distance / event.radius, 0, 1) * (event.type === 'wolf' ? 0.85 : 0.18));
        event.cooldown = Math.max(0, event.cooldown - dt);
    });
    if (GAME_STATE.touchTarget) threat = Math.max(threat, GAME_STATE.touchTarget.facing * 0.22);
    if (GAME_STATE.isTrapped) threat = Math.max(threat, 0.72);
    const targetFear = THREE.MathUtils.clamp(threat * 0.8 + (GAME_STATE.fatigue * 0.2), 0, 1);
    GAME_STATE.fear = THREE.MathUtils.lerp(GAME_STATE.fear, targetFear, dt * 1.8);
    GAME_STATE.touchPulse = Math.max(0, GAME_STATE.touchPulse - dt * 2.8);

    if (scene && scene.fog) {
        scene.fog.density = 0.0052 + GAME_STATE.fear * 0.0035 + (GAME_STATE.isTrapped ? 0.0015 : 0);
    }
    const vignette = document.getElementById('vignette');
    if (vignette && GAME_STATE.started && elapsed - lastAtmosphereUiUpdate > 0.05) {
        lastAtmosphereUiUpdate = elapsed;
        const red = Math.round(12 + GAME_STATE.fear * 115);
        const alpha = (0.46 + GAME_STATE.fear * 0.34).toFixed(2);
        vignette.style.background = `radial-gradient(circle at center, transparent 48%, rgba(${red}, 13, 9, ${alpha}) 86%, rgba(0, 0, 0, 0.94) 100%)`;
    }
    if (camera && GAME_STATE.phase !== 'ENDING_SEQUENCE') {
        camera.rotation.z = Math.sin(elapsed * (8 + GAME_STATE.fear * 8)) * GAME_STATE.fear * 0.012;
    }
}

function triggerWildlifeAudio() {
    if (!audioEngine.initialized || !camera) return;
    const candidates = audioWildlife
        .map((event) => ({ event, distance: Math.hypot(camera.position.x - event.position.x, camera.position.z - event.position.z) }))
        .filter(({ event, distance }) => distance < event.radius && event.cooldown <= 0);
    if (!candidates.length) return;
    candidates.sort((a, b) => a.distance - b.distance);
    const chosen = candidates[0];
    if (chosen.event.type === 'wolf') {
        audioEngine.playWolfCall(chosen.distance, GAME_STATE.fear);
        chosen.event.cooldown = 10 + Math.random() * 8;
    } else {
        audioEngine.playSquirrelChatter(chosen.distance, GAME_STATE.fear);
        chosen.event.cooldown = 7 + Math.random() * 6;
    }
}

let glimpseTimer = null;

function setupInputControls() {
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
        if (k === 's' || e.key === 'ArrowDown') keys.s = true;
        if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
        if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
        if (e.key === 'Shift') {
            GAME_STATE.sprint = true;
            updateRunButtonUI();
        }
    });

    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
        if (k === 's' || e.key === 'ArrowDown') keys.s = false;
        if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
        if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
        if (e.key === 'Shift') {
            GAME_STATE.sprint = false;
            updateRunButtonUI();
        }
    });

    const runBtn = document.getElementById('run-toggle-btn');
    runBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        GAME_STATE.sprint = !GAME_STATE.sprint;
        updateRunButtonUI();
    });

    const canvasEl = renderer.domElement;
    canvasEl.addEventListener('mousedown', (e) => {
        isPointerDown = true;
        prevPointer = { x: e.clientX, y: e.clientY };
        touchNearbyObject();
    });
    window.addEventListener('mouseup', () => { isPointerDown = false; });
    window.addEventListener('mousemove', (e) => {
        if (!isPointerDown || !GAME_STATE.started) return;
        GAME_STATE.cameraYaw -= (e.clientX - prevPointer.x) * 0.0038;
        GAME_STATE.cameraPitch = Math.max(-0.65, Math.min(0.65, GAME_STATE.cameraPitch - (e.clientY - prevPointer.y) * 0.0038));
        prevPointer = { x: e.clientX, y: e.clientY };
    });

    let moveTouchId = null, moveOrigin = { x: 0, y: 0 };
    let lookTouchId = null, lastLook = { x: 0, y: 0 };
    const leftRing = document.getElementById('left-touch-ring');
    const rightRing = document.getElementById('right-touch-ring');

    canvasEl.addEventListener('touchstart', (e) => {
        if (!GAME_STATE.started) return;
        e.preventDefault();
        touchNearbyObject();
        for (let t of e.changedTouches) {
            if (t.clientX < window.innerWidth * 0.5 && moveTouchId === null) {
                moveTouchId = t.identifier;
                moveOrigin = { x: t.clientX, y: t.clientY };
                leftRing.style.left = `${t.clientX}px`;
                leftRing.style.top = `${t.clientY}px`;
                leftRing.classList.remove('opacity-0');
            } else if (lookTouchId === null) {
                lookTouchId = t.identifier;
                lastLook = { x: t.clientX, y: t.clientY };
                rightRing.style.left = `${t.clientX}px`;
                rightRing.style.top = `${t.clientY}px`;
                rightRing.classList.remove('opacity-0');
            }
        }
    }, { passive: false });

    canvasEl.addEventListener('touchmove', (e) => {
        if (!GAME_STATE.started) return;
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (t.identifier === moveTouchId) {
                joystickVector.x = Math.max(-1, Math.min(1, (t.clientX - moveOrigin.x) / 50));
                joystickVector.y = Math.max(-1, Math.min(1, (t.clientY - moveOrigin.y) / 50));
                if ((t.clientY - moveOrigin.y) < -68) {
                    GAME_STATE.sprint = true;
                    updateRunButtonUI();
                }
                leftRing.style.left = `${t.clientX}px`;
                leftRing.style.top = `${t.clientY}px`;
            } else if (t.identifier === lookTouchId) {
                GAME_STATE.cameraYaw -= (t.clientX - lastLook.x) * 0.0048;
                GAME_STATE.cameraPitch = Math.max(-0.65, Math.min(0.65, GAME_STATE.cameraPitch - (t.clientY - lastLook.y) * 0.0048));
                lastLook = { x: t.clientX, y: t.clientY };
                rightRing.style.left = `${t.clientX}px`;
                rightRing.style.top = `${t.clientY}px`;
            }
        }
    }, { passive: false });

    const endTouches = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === moveTouchId) {
                moveTouchId = null;
                joystickVector = { x: 0, y: 0 };
                leftRing.classList.add('opacity-0');
            }
            if (t.identifier === lookTouchId) {
                lookTouchId = null;
                rightRing.classList.add('opacity-0');
            }
        }
    };
    canvasEl.addEventListener('touchend', endTouches);
    canvasEl.addEventListener('touchcancel', endTouches);
}

function spawnFootstepRipple(x, z) {
    const ripple = splashRipples.find(r => !r.active);
    if (!ripple) return;
    ripple.active = true;
    ripple.age = 0;
    ripple.mesh.position.set(x, terrainHeightAt(x, z) + 0.045, z);
    ripple.mesh.scale.set(0.25, 0.25, 0.25);
    ripple.mesh.material.opacity = 0.28;
}

function createRainPuddles() {
    const puddleGeo = new THREE.CircleGeometry(1, 32);
    puddleGeo.rotateX(-Math.PI / 2);
    for (let i = 0; i < 34; i++) {
        const angle = i * 2.39996;
        const distance = 7 + (i % 13) * 8.2;
        const x = Math.sin(angle) * distance * 2.4;
        const z = 4 - (i % 29) * 10.4 - Math.cos(angle * 0.6) * 18;
        const material = new THREE.MeshStandardMaterial({
            color: 0x203c39,
            roughness: 0.22,
            metalness: 0.0,
            transparent: true,
            opacity: 0.18 + (i % 4) * 0.025,
            depthWrite: false
        });
        const puddle = new THREE.Mesh(puddleGeo, material);
        puddle.position.set(x, terrainHeightAt(x, z) + 0.018, z);
        puddle.scale.set(0.8 + (i % 5) * 0.24, 1, 0.45 + (i % 4) * 0.18);
        puddle.rotation.y = angle;
        puddle.receiveShadow = true;
        scene.add(puddle);
        puddleMeshes.push({ mesh: puddle, baseOpacity: material.opacity, phase: angle });
    }
}

function triggerHazardOutcome(hazard) {
    GAME_STATE.currentOutcome = hazard;
    GAME_STATE.phase = 'ENDING_SEQUENCE';
    GAME_STATE.endingTimer = 0;
    document.getElementById('vignette').classList.add('danger-pulse');

    if (hazard.outcomeType === 'PREDATOR_AMBUSH' || hazard.outcomeType === 'TERROR_PACK') {
        showAnimalGlimpse('wolf');
        const predator = prehistoricAnimals.find(a => a.type === 'AMBUSH_PREDATOR');
        if (predator) {
            predator.mesh.visible = true;
            const forward = new THREE.Vector3(-Math.sin(GAME_STATE.cameraYaw), 0, -Math.cos(GAME_STATE.cameraYaw));
            predator.mesh.position.copy(camera.position).addScaledVector(forward, 5.5);
            predator.mesh.position.y = 0;
            predator.mesh.lookAt(camera.position.x, 1.2, camera.position.z);
        }
    }

    audioEngine.playAttackAndScream(GAME_STATE.gender, hazard.outcomeType);
}

function showFinalEndingModal() {
    GAME_STATE.phase = 'ENDED';
    const outcome = GAME_STATE.currentOutcome;
    document.getElementById('ending-title').textContent = outcome.title;
    document.getElementById('ending-desc').textContent = outcome.desc;

function animateLoop() {
    requestAnimationFrame(animateLoop);
    const dt = Math.min(clock.getDelta(), 0.1);
    const elapsed = clock.getElapsedTime();
    animationFrameIndex++;

    // Update wind-animated foliage & water shaders
    if ((animationFrameIndex & 1) === 0) {
        for (let i = 0; i < windMaterials.length; i++) {
            windMaterials[i].uniforms.uTime.value = elapsed;
        }
        for (let i = 0; i < volumetricRays.length; i++) {
            volumetricRays[i].material.uniforms.uTime.value = elapsed;
        }
    }
    if (riverShaderMat) riverShaderMat.uniforms.uTime.value = elapsed;
    if (waterfallShaderMat) waterfallShaderMat.uniforms.uTime.value = elapsed;
    if (starField) {
        starField.rotation.y = elapsed * 0.0015;
        starField.material.opacity = 0.68 + Math.sin(elapsed * 0.22) * 0.06;
    }
    if (forestPropsGroup && camera && (animationFrameIndex & 1) === 0) updateForestProps(dt * 2, elapsed);

    // Update Tropical Rain & Puddle Splash Ripples
    if (rainSystem) {
        rainSystem.visible = GAME_STATE.rainIntensity > 0.05;
        const rPos = rainSystem.geometry.attributes.position.array;
        for (let i = 0; i < rPos.length; i += 6) {
            rPos[i+1] -= 28.0 * dt;
            rPos[i+4] -= 28.0 * dt;
            if (rPos[i+1] < 0) {
                const nx = camera.position.x + (Math.random() - 0.5) * 55;
                const nz = camera.position.z + (Math.random() - 0.5) * 55;
                rPos[i] = nx; rPos[i+1] = 24.0; rPos[i+2] = nz;
                rPos[i+3] = nx - 0.04; rPos[i+4] = 23.15; rPos[i+5] = nz;

                if (GAME_STATE.rainIntensity > 0.2 && Math.random() < 0.075) {
                    spawnFootstepRipple(nx, nz);
                }
            }
        }
        rainSystem.geometry.attributes.position.needsUpdate = true;
    }

    splashRipples.forEach(r => {
        if (!r.active) return;
        r.age += dt;
        const p = r.age / r.maxAge;
        if (p >= 1.0) {
            r.active = false;
            r.mesh.material.opacity = 0;
        } else {
            const s = 0.25 + p * 2.6;
            r.mesh.scale.set(s, s, s);
            r.mesh.material.opacity = (1.0 - p) * 0.55;
        }
    });
    puddleMeshes.forEach((puddle) => {
        puddle.mesh.material.opacity = puddle.baseOpacity + Math.sin(elapsed * 0.7 + puddle.phase) * 0.018;
    });

    // Update Shimmering Spores
    if (sporeSystem && (animationFrameIndex & 3) === 0) {
        const sPos = sporeSystem.geometry.attributes.position.array;
        for (let i = 1; i < sPos.length; i += 3) {
            sPos[i] += Math.sin(elapsed * 1.2 + i) * 0.005;
        }
        sporeSystem.geometry.attributes.position.needsUpdate = true;
    }

    // Update Articulated 2-Wing Butterflies & Hopping Dart Frogs
    butterflies.forEach(b => {
        const flap = Math.sin(elapsed * 16.0 + b.phase) * 0.85;
        b.leftWing.rotation.y = flap;
        b.rightWing.rotation.y = -flap;
        b.group.position.x = b.baseX + Math.sin(elapsed * b.speed + b.phase) * 2.2;
        b.group.position.y = b.baseY + Math.cos(elapsed * (b.speed * 1.3) + b.phase) * 0.55;
        b.group.position.z = b.baseZ + Math.cos(elapsed * b.speed + b.phase) * 2.2;
        b.group.rotation.y = elapsed * b.speed + b.phase;
    });

    dartFrogs.forEach(f => {
        const hopCycle = (elapsed * 1.8 + f.phase) % 4.0;
        if (hopCycle < 0.45) {
            const h = Math.sin((hopCycle / 0.45) * Math.PI);
            f.mesh.position.y = 0.02 + h * 0.32;
            f.mesh.translateZ(dt * 1.8);
        } else {
            f.mesh.position.y = 0.02;
        }
    });

    // Update Prehistoric Megafauna Kinematics
    prehistoricAnimals.forEach(animal => {
        const limbs = animal.mesh.userData.limbs || [];
        if (animal.type === 'ROAM_SAUROPOD') {
            animal.mesh.position.x += animal.speed * dt * animal.dir;
            limbs.forEach(l => {
                l.pivot.rotation.x = Math.sin(elapsed * 2.2 + l.phase) * 0.26;
            });
            if (animal.mesh.position.x > animal.maxX) {
                animal.dir = -1;
                animal.mesh.rotation.y = -Math.PI * 0.5;
            } else if (animal.mesh.position.x < animal.minX) {
                animal.dir = 1;
                animal.mesh.rotation.y = Math.PI * 0.5;
            }
        } else if (animal.type === 'SURPRISE_BIRD' && animal.active) {
            animal.mesh.position.x += animal.speed * dt;
            limbs.forEach(l => {
                l.pivot.rotation.x = Math.sin(elapsed * 14.0 + l.phase) * 0.65;
            });
            if (animal.mesh.position.x > 65) animal.active = false;
        }
    });
    realWildlifeMixers.forEach((mixer) => mixer.update(dt));
    realWildlifeActors.forEach((actor) => {
        if (actor.type === 'wolf') {
            actor.object.position.x = actor.base.x + Math.sin(elapsed * 0.16 + actor.phase) * 5.5;
            actor.object.position.z = actor.base.z + Math.cos(elapsed * 0.13 + actor.phase) * 3.2;
            actor.object.rotation.y = Math.sin(elapsed * 0.16 + actor.phase) > 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
        } else {
            actor.object.position.x = actor.base.x + Math.sin(elapsed * 0.52 + actor.phase) * 1.4;
            actor.object.position.y = actor.base.y + Math.abs(Math.sin(elapsed * 2.1 + actor.phase)) * 0.14;
            actor.object.rotation.y = elapsed * 0.52 + actor.phase;
        }
    });
    realVegetationActors.forEach((actor) => {
        const dx = actor.x - camera.position.x;
        const dz = actor.z - camera.position.z;
        actor.object.visible = (dx * dx + dz * dz) < 230 * 230;
    });

    if (!GAME_STATE.started) {
        camera.position.x = Math.sin(elapsed * 0.25) * 0.6;
        camera.lookAt(0, 1.8, -18);
        renderer.render(scene, camera);
        return;
    }

    // Active First-Person Free-Roam Exploration
    if (GAME_STATE.phase === 'WALKING' || GAME_STATE.phase === 'SANCTUARY_FREEROAM') {
        let moveForward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0) - joystickVector.y;
        let moveTurn = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joystickVector.x;
        moveForward = Math.max(-1, Math.min(1, moveForward));
        moveTurn = Math.max(-1, Math.min(1, moveTurn));

        if (Math.abs(moveTurn) > 0.04) {
            GAME_STATE.cameraYaw -= moveTurn * 1.45 * dt;
        }

        const isMoving = Math.abs(moveForward) > 0.05 || Math.abs(moveTurn) > 0.08;
        updateInteractiveProximity();
        const previousWaterState = GAME_STATE.inWater;
        GAME_STATE.waterDepth = waterDepthAt(camera.position);
        GAME_STATE.inWater = GAME_STATE.waterDepth > 0.08;
        if (GAME_STATE.inWater && !previousWaterState && audioEngine.initialized) audioEngine.playWaterStep(false, GAME_STATE.waterDepth);

        // Fatigue & Stamina calculation
        const fatigueDelta = isMoving ? (GAME_STATE.sprint ? 0.11 : 0.025) : -0.16;
        GAME_STATE.fatigue = Math.min(1.0, Math.max(0.0, GAME_STATE.fatigue + fatigueDelta * dt));

        // Distinct grounded walk/run speeds with acceleration instead of a gamey instant jump.
        const targetSpeed = (GAME_STATE.sprint ? 25.5 : 8.8) * 0.9 * (1.0 - GAME_STATE.waterDepth * 0.58);
        const speedScale = 1.0 - GAME_STATE.fatigue * 0.15 - GAME_STATE.fear * 0.08;
        GAME_STATE.moveVelocity = THREE.MathUtils.lerp(GAME_STATE.moveVelocity, isMoving ? targetSpeed * speedScale : 0, dt * (GAME_STATE.sprint ? 8 : 6));
        const moveSpeed = GAME_STATE.moveVelocity;

        if (isMoving) {
            const forward = new THREE.Vector3(-Math.sin(GAME_STATE.cameraYaw), 0, -Math.cos(GAME_STATE.cameraYaw));
            const right = new THREE.Vector3(Math.cos(GAME_STATE.cameraYaw), 0, -Math.sin(GAME_STATE.cameraYaw));
            const nextPosition = camera.position.clone();
            nextPosition.addScaledVector(forward, moveForward * moveSpeed * dt);
            nextPosition.addScaledVector(right, moveTurn * moveSpeed * 0.65 * dt);
            resolveWorldCollision(nextPosition);
            camera.position.copy(nextPosition);

            // Wide-open bounds so player is never trapped
            camera.position.x = Math.max(-280, Math.min(280, camera.position.x));
            camera.position.z = Math.max(-520, Math.min(22, camera.position.z));

            const bobFreq = (GAME_STATE.sprint ? 15.0 : 9.5) * (1.0 - GAME_STATE.waterDepth * 0.34);
            GAME_STATE.bobTimer += dt * bobFreq;
            camera.position.y = terrainHeightAt(camera.position.x, camera.position.z) + 1.7 - GAME_STATE.waterDepth * 0.12 + Math.sin(GAME_STATE.bobTimer) * (GAME_STATE.sprint ? 0.09 : 0.045) * (1.0 - GAME_STATE.waterDepth * 0.42);

            // Natural First-Person Arm Swing & Finger Flexing Kinematics
            if (leftHandGroup && rightHandGroup) {
                const swing = Math.sin(GAME_STATE.bobTimer * 0.5);
                const pump = Math.abs(Math.cos(GAME_STATE.bobTimer * 0.5));
                const reach = GAME_STATE.touchTarget ? GAME_STATE.touchPulse * 0.12 : 0;
                const waterMotion = 1.0 - GAME_STATE.waterDepth * 0.58;
                leftHandGroup.position.z = -0.48 + swing * (GAME_STATE.sprint ? 0.13 : 0.065) * waterMotion - reach;
                leftHandGroup.position.y = -0.23 + pump * (GAME_STATE.sprint ? 0.075 : 0.03) * waterMotion + reach * 0.45;
                rightHandGroup.position.z = -0.48 - swing * (GAME_STATE.sprint ? 0.13 : 0.065) * waterMotion - reach * 0.4;
                rightHandGroup.position.y = -0.23 + pump * (GAME_STATE.sprint ? 0.075 : 0.03) * waterMotion + reach * 0.2;
                leftHandGroup.rotation.x = 0.22 + Math.sin(GAME_STATE.bobTimer) * (GAME_STATE.sprint ? 0.1 : 0.045) * waterMotion - reach * 0.45;
                rightHandGroup.rotation.x = 0.22 - Math.sin(GAME_STATE.bobTimer) * (GAME_STATE.sprint ? 0.1 : 0.045) * waterMotion - reach * 0.2;
                leftHandGroup.rotation.z = -0.08 + swing * 0.06;
                rightHandGroup.rotation.z = 0.08 + swing * 0.06;
            }

            // Footstep Audio & Puddle Splash Sync
            GAME_STATE.stepAccum += dt * (GAME_STATE.sprint ? 4.3 : 2.1);
            if (GAME_STATE.stepAccum >= 1) {
                GAME_STATE.stepAccum -= 1;
                if (!GAME_STATE.isTrapped) {
                    if (GAME_STATE.inWater) audioEngine.playWaterStep(GAME_STATE.sprint, GAME_STATE.waterDepth);
                    else audioEngine.playFootstep(GAME_STATE.sprint);
                    spawnFootstepRipple(camera.position.x, camera.position.z);
                }
            }
        } else {
            GAME_STATE.waterDepth = waterDepthAt(camera.position);
            GAME_STATE.inWater = GAME_STATE.waterDepth > 0.08;
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, terrainHeightAt(camera.position.x, camera.position.z) + 1.7 - GAME_STATE.waterDepth * 0.12 + Math.sin(elapsed * 2.2) * 0.015, dt * 5);
            if (leftHandGroup && rightHandGroup) {
                const reach = GAME_STATE.touchTarget ? GAME_STATE.touchPulse * 0.12 : 0;
                leftHandGroup.position.y = THREE.MathUtils.lerp(leftHandGroup.position.y, -0.23 + Math.sin(elapsed * 2.2) * 0.008 + reach * 0.4, dt * 4);
                rightHandGroup.position.y = THREE.MathUtils.lerp(rightHandGroup.position.y, -0.23 + Math.cos(elapsed * 2.2) * 0.008 + reach * 0.2, dt * 4);
                leftHandGroup.position.z = THREE.MathUtils.lerp(leftHandGroup.position.z, -0.48 - reach, dt * 4);
                rightHandGroup.position.z = THREE.MathUtils.lerp(rightHandGroup.position.z, -0.48 - reach * 0.4, dt * 4);
                leftHandGroup.rotation.x = THREE.MathUtils.lerp(leftHandGroup.rotation.x, 0.22 - reach * 0.45, dt * 4);
                rightHandGroup.rotation.x = THREE.MathUtils.lerp(rightHandGroup.rotation.x, 0.22 - reach * 0.2, dt * 4);
                leftHandGroup.rotation.z = THREE.MathUtils.lerp(leftHandGroup.rotation.z, -0.08, dt * 4);
                rightHandGroup.rotation.z = THREE.MathUtils.lerp(rightHandGroup.rotation.z, 0.08, dt * 4);
            }
        }

        // Subtle live finger articulation
        const allFingers = leftFingers.concat(rightFingers);
        for (let i = 0; i < allFingers.length; i++) {
            const f = allFingers[i];
            f.group.rotation.x = f.baseCurl + Math.sin(elapsed * 2.4 + f.phase) * 0.06 + (GAME_STATE.sprint ? 0.14 : 0) + (GAME_STATE.touchTarget ? GAME_STATE.touchPulse * 0.18 : 0);
        }

        // Dynamic Tired Breathing Audio
        const breathingActive = isMoving || GAME_STATE.fear > 0.42;
        if (breathingActive) {
            GAME_STATE.breathTimer -= dt * (0.65 + GAME_STATE.fatigue * 0.9 + GAME_STATE.fear * 0.6);
            if (GAME_STATE.breathTimer <= 0) {
                audioEngine.playBreathing(GAME_STATE.gender, GAME_STATE.fatigue);
                GAME_STATE.breathTimer = Math.max(2.0, 3.2 - GAME_STATE.fatigue * 0.7 - GAME_STATE.fear * 0.5);
            }
        } else {
            GAME_STATE.breathTimer = Math.max(GAME_STATE.breathTimer, 1.1);
        }

        // Nocturnal & Distant Prehistoric Calls
        GAME_STATE.ambientTimer -= dt;
        if (GAME_STATE.ambientTimer <= 0) {
            if (isMoving || GAME_STATE.fear > 0.55) triggerWildlifeAudio();
            GAME_STATE.ambientTimer = 3.8 + Math.random() * 4.2;
        }

        // Surprise Mid-Jungle Terror Bird Sprint Encounter
        if (!GAME_STATE.surpriseTriggered && camera.position.z < -48) {
            GAME_STATE.surpriseTriggered = true;
            const bird = prehistoricAnimals.find(a => a.type === 'SURPRISE_BIRD');
            if (bird) {
                bird.active = true;
                bird.mesh.position.set(camera.position.x - 28, 0, camera.position.z - 18);
                audioEngine.playNightJungleCall('close');
            }
        }

        // Save periodic safe checkpoint
        if (camera.position.z > -115) {
            GAME_STATE.checkpointPos.x = camera.position.x;
            GAME_STATE.checkpointPos.z = camera.position.z;
        }

        // Check Unmarked Natural Hazard Zones
        if (GAME_STATE.phase === 'WALKING') {
            for (let h of HAZARD_ZONES) {
                const dist = Math.hypot(camera.position.x - h.x, camera.position.z - h.z);
                if (dist < h.radius) {
                    triggerHazardOutcome(h);
                    break;
                }
            }

            // Only one winding path reaches river, flowers, stars, and moonlit sanctuary.
            if (GAME_STATE.phase === 'WALKING' && camera.position.z < -188 && !isSafeSanctuaryPath(camera.position)) {
                triggerHazardOutcome({
                    outcomeType: 'LOST_PATH',
                    title: 'THE FOREST HAS NO EXIT',
                    desc: 'Every wrong direction closes into wet roots and shadow'
                });
            }

            // Seamless entry into the Winning Sanctuary of Golden Falls (No Pop-up UI!)
            if (GAME_STATE.phase === 'WALKING' && camera.position.z < -188 && isSafeSanctuaryPath(camera.position)) {
                GAME_STATE.phase = 'SANCTUARY_FREEROAM';
                GAME_STATE.rainIntensity = 0.62;
                audioEngine.setRainVolume(0.38);
                scene.fog.color.setHex(0x0b1b25);
                scene.fog.density = 0.0038;
                sunLight.color.setHex(0x9ab6d6);
                sunLight.intensity = 0.86;
                hemiLight.intensity = 0.32;
                audioEngine.playNightJungleCall('close');
            }
        }

        camera.rotation.order = 'YXZ';
        camera.rotation.y = GAME_STATE.cameraYaw;
        camera.rotation.x = GAME_STATE.cameraPitch;
    }

    // Dramatic Predator / Trap Camera Sequence
    if (GAME_STATE.phase === 'ENDING_SEQUENCE') {
        GAME_STATE.endingTimer += dt;
        const predator = prehistoricAnimals.find(a => a.type === 'AMBUSH_PREDATOR');
        if (predator && predator.mesh.visible) {
            predator.mesh.position.lerp(new THREE.Vector3(camera.position.x, 0, camera.position.z), dt * 3.8);
        }
        camera.position.y = Math.max(0.35, camera.position.y - 2.2 * dt);
        camera.rotation.z = Math.sin(GAME_STATE.endingTimer * 14.0) * 0.18;
        if (GAME_STATE.endingTimer > 2.4) {
            showFinalEndingModal();
        }
    }

    if (GAME_STATE.started) updateFearAtmosphere(dt, elapsed);

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = function () {
    initThreeScene();
    setupInputControls();
    animateLoop();

    const runToggleBtn = document.getElementById('run-toggle-btn');
    const directionPad = document.getElementById('direction-pad');
    directionPad.querySelectorAll('button[data-key]').forEach((button) => {
        const key = button.dataset.key;
        const press = (event) => { event.preventDefault(); keys[key] = true; button.setPointerCapture?.(event.pointerId); };
        const release = (event) => { event.preventDefault(); keys[key] = false; };
        button.addEventListener('pointerdown', press);
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('pointerleave', release);
    });

    document.getElementById('begin-btn').addEventListener('click', async () => {
        if (!GAME_STATE.assetsReady) return;
        await audioEngine.init();
        GAME_STATE.started = true;
        document.getElementById('start-modal').classList.add('hidden');
        runToggleBtn.classList.remove('hidden');
        directionPad.classList.remove('hidden');
    });

    document.getElementById('retry-fork-btn').addEventListener('click', () => {
        document.getElementById('vignette').classList.remove('danger-pulse');
        const predator = prehistoricAnimals.find(a => a.type === 'AMBUSH_PREDATOR');
        if (predator) predator.mesh.visible = false;
        camera.position.set(GAME_STATE.checkpointPos.x, 1.7, GAME_STATE.checkpointPos.z);
        camera.rotation.z = 0;
        GAME_STATE.moveVelocity = 0;
        GAME_STATE.fear = 0.15;
        GAME_STATE.isTrapped = false;
        GAME_STATE.touchTarget = null;
        GAME_STATE.phase = 'WALKING';
        document.getElementById('ending-modal').classList.add('hidden');
    });

    document.getElementById('restart-full-btn').addEventListener('click', () => {
        document.getElementById('vignette').classList.remove('danger-pulse');
        const predator = prehistoricAnimals.find(a => a.type === 'AMBUSH_PREDATOR');
        if (predator) predator.mesh.visible = false;
        camera.position.set(0, 1.7, 8);
        camera.rotation.z = 0;
        GAME_STATE.cameraYaw = 0;
        GAME_STATE.cameraPitch = 0;
        GAME_STATE.moveVelocity = 0;
        GAME_STATE.fear = 0;
        GAME_STATE.isTrapped = false;
        GAME_STATE.touchTarget = null;
        GAME_STATE.surpriseTriggered = false;
        GAME_STATE.rainIntensity = 0.85;
        scene.fog.color.setHex(0x071018);
        scene.fog.density = 0.0048;
        sunLight.color.setHex(0x91afd0);
        sunLight.intensity = 0.78;
        hemiLight.intensity = 0.28;
        GAME_STATE.phase = 'WALKING';
        document.getElementById('ending-modal').classList.add('hidden');
    });
};
</script>
